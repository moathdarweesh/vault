<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>تحميل THE VAULT</title>
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="THE VAULT — تطبيق اللياقة">
  <meta property="og:description" content="حمّل تطبيق THE VAULT لتتبّع تمارينك وتغذيتك ونومك.">
  <link rel="icon" type="image/svg+xml" href="../icons/icon.svg?v=215">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Archivo is not optional here: the wordmark is set in it, and without it
       the browser fell back to IBM Plex Sans Arabic's 900 and the mark on the
       public download page was simply not the mark. -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Archivo:wght@900&display=swap" rel="stylesheet">
  <style>
    :root{ --accent:#ff6a00; --bg:#000; --card:#0d0a07; --text:#f4efe9; --dim:#8f8478; --border:rgba(255,232,212,.11); }
    *{ box-sizing:border-box; margin:0; padding:0; }
    html,body{ height:100%; }
    body{
      background:var(--bg); color:var(--text);
      font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,sans-serif;
      display:grid; place-items:center; min-height:100dvh; padding:24px;
      overflow:hidden; position:relative;
    }
    body::before{
      content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
      background:
        radial-gradient(60% 50% at 50% 0%, rgba(255,106,0,.20), transparent 70%),
        radial-gradient(50% 40% at 50% 100%, rgba(255,106,0,.09), transparent 70%);
    }
    .card{
      position:relative; z-index:1; width:100%; max-width:420px; text-align:center;
      background:linear-gradient(180deg, rgba(24,24,28,.9), rgba(12,12,14,.9));
      border:1px solid var(--border); border-radius:28px;
      padding:40px 28px 32px; backdrop-filter:blur(20px);
      box-shadow:0 30px 80px rgba(0,0,0,.6);
      animation:rise .5s cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes rise{ from{ opacity:0; transform:translateY(16px); } to{ opacity:1; transform:none; } }
    /* The actual app icon, not a decoration: black tile at the brand's 22.5%
       radius (17px on 76) carrying the V letterform, so the visitor sees the
       icon that will land on their home screen. */
    .logo{
      width:76px; height:76px; margin:0 auto 20px; border-radius:17px;
      display:grid; place-items:center;
      background:#000; overflow:hidden; position:relative;
    }
    /* The five-bar field as a pinstripe, same 6-on-33 rhythm as icons/icon.svg. */
    .logo::before{
      content:''; position:absolute; inset:0;
      background:repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 2px, transparent 2px 11px);
    }
    .logo svg{ width:46px; height:46px; position:relative; }
    /* THE CUT, per the Claude Design spec "Vault Logo CUT". The page used to
       stack a tracked-out "THE" over a tracked-out "VAULT" at 6px and 8px of
       letter-spacing; the spec lists exactly that as a DON'T, because once the
       letters drift apart the slot stops reading as a cut through a word and
       becomes a line lying next to some characters. One lockup, .02em.

       WHY THIS ONE IS MASKED AND THE APP'S IS PAINTED. The spec draws the slot
       as a div filled with the surface colour, which is what styles.css does —
       it is exact and self-documenting when the surface is a flat token. This
       card is not flat: it is a translucent gradient over a radial glow, so no
       single colour can match it at the wordmark's height. Masking removes the
       band instead of overpainting it, so whatever is behind shows through and
       the slot stays correct however the card is restyled. The hairline has to
       live on the PARENT, since a mask applies to the element's own pseudo
       elements too and would erase a hairline sitting inside the gap. */
    .brand{
      position:relative; display:inline-block; margin-bottom:22px;
      font-family:Archivo,system-ui,sans-serif; font-weight:900;
      font-size:30px; line-height:1; letter-spacing:.02em; text-transform:uppercase;
      color:var(--text);
      --slot:2.1px;   /* 7% of 30px */
      --hair:1.5px;   /* the spec's floor */
    }
    .brand-cut{
      display:block;
      -webkit-mask-image:linear-gradient(to bottom, #000 0 calc(50% - var(--slot)/2), transparent calc(50% - var(--slot)/2) calc(50% + var(--slot)/2), #000 calc(50% + var(--slot)/2) 100%);
      mask-image:linear-gradient(to bottom, #000 0 calc(50% - var(--slot)/2), transparent calc(50% - var(--slot)/2) calc(50% + var(--slot)/2), #000 calc(50% + var(--slot)/2) 100%);
    }
    .brand::after{
      content:''; position:absolute; left:0; right:0; top:50%;
      height:var(--hair); transform:translateY(-50%);
      background:var(--accent); pointer-events:none;
    }
    .status{ display:flex; align-items:center; justify-content:center; gap:10px; color:var(--dim); font-size:15px; font-weight:500; margin-bottom:26px; min-height:22px; }
    .spinner{ width:18px; height:18px; border:2px solid rgba(255,255,255,.18); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
    @keyframes spin{ to{ transform:rotate(360deg); } }
    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:10px;
      width:100%; padding:16px 22px; border-radius:16px; border:none;
      /* Ink, NOT white. White on #ff6a00 is 2.87:1 — a ratio BRAND.md itself
         publishes as a failure — and this is the one button on the one page a
         new user sees before they have the app at all. The dark ink is 6.78:1
         on the same fill and is what the accent is designed to carry. */
      background:var(--accent); color:#1a1512; font-family:inherit; font-size:17px; font-weight:800;
      cursor:pointer; text-decoration:none; transition:transform .12s ease, filter .2s ease;
    }
    .btn:active{ transform:scale(.97); }
    .btn:hover{ filter:brightness(1.08); }
    .btn svg{ width:20px; height:20px; }
    .meta{ margin-top:16px; font-size:13px; color:var(--dim); font-weight:500; }
    .note{
      margin-top:20px; padding-top:18px; border-top:1px solid var(--border);
      font-size:12.5px; color:var(--dim); line-height:1.7; text-align:start;
    }
    .note b{ color:#cfcfcf; font-weight:700; }
    .ver{ margin-top:14px; font-size:11px; letter-spacing:1px; color:#5a5a5a; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <!-- The cut monogram, matching icons/icon.svg: the V, then the slot in
           the tile colour, then the hairline. The monogram exception applies —
           11% of the 24-unit em, not 7%, because a 7% slot is swallowed where
           the two diagonals meet. Slot y 11.13..13.77 straddles the optical
           middle of the cap height (12.45); the hairline is 2.4% of the em. -->
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4.4 4.5h3.4l4.2 11.4L16.2 4.5h3.4L13.7 20.4h-3.4Z" fill="#ff6a00"/>
        <rect x="5.616" y="11.13" width="12.768" height="2.64" fill="#000"/>
        <rect x="5.616" y="12.162" width="12.768" height="0.576" fill="#ff6a00"/>
      </svg>
    </div>
    <div class="brand"><span class="brand-cut">THE VAULT</span></div>

    <div class="status" id="status">
      <span class="spinner"></span>
      <span>جارٍ بدء التحميل…</span>
    </div>

    <a class="btn" id="download" href="#" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.6 16.4h2.8V19h13.2v-2.6h2.8V21.8H2.6Z" fill="currentColor"/><path d="M10.6 2.6h2.8v8.6l3.6-3.6 2 2L12 16.6 5 9.6l2-2 3.6 3.6Z" fill="currentColor"/></svg>
      تحميل التطبيق
    </a>
    <div class="meta" id="meta">تطبيق أندرويد · ملف APK</div>

    <div class="note">
      <b>خطوات التثبيت:</b><br>
      ١) إن ظهر تحذير «تعذّر فحص الفيروسات» اضغط <b>«تنزيل على أي حال»</b> — طبيعي مع ملفات APK.<br>
      ٢) بعد التحميل افتح الملف واسمح بـ«تثبيت من مصدر غير معروف» إن طُلب.
    </div>
    <div class="ver" id="ver"></div>
  </div>

  <script>
    // Permanent, brand-clean download link. Reads the current APK URL from the
    // app's version manifest so this page NEVER needs editing across releases;
    // falls back to a hardcoded direct link if the manifest can't be reached.
    //
    // The fallback tracks the SAME repo path version.json points at. It used to be
    // a Google Drive file id pinned to the v109 APK, so any hiccup fetching the
    // manifest quietly handed people a build from several versions back. This URL
    // is stable across releases because the file name never changes.
    var FALLBACK = 'https://raw.githubusercontent.com/moathdarweesh/vault/main/download/THE-VAULT.apk';
    var btn = document.getElementById('download');
    var statusEl = document.getElementById('status');
    var verEl = document.getElementById('ver');

    function ready(url, version){
      btn.setAttribute('href', url);
      statusEl.innerHTML = '<span>يبدأ التنزيل تلقائيًّا…</span>';
      if (version) verEl.textContent = 'الإصدار ' + version;
      // Trigger the download (attachment ⇒ starts downloading without leaving the page).
      try { window.location.href = url; } catch (e) {}
    }

    fetch('../version.json?_=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        var apk = j && j.apk;
        ready((apk && apk.url) ? apk.url : FALLBACK, apk && apk.version);
      })
      .catch(function(){ ready(FALLBACK, null); });
  </script>
</body>
</html>
