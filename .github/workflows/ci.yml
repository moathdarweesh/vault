# Proves the WEB app is sound, on every push and every pull request.
#
# WHY THIS EXISTS
# Until now the only gate on this project was a LOCAL pre-commit hook. That hook
# is real and it is good — but it is opt-in (`npm run hooks` sets
# core.hooksPath), it is bypassable (`--no-verify`, `SKIP_RELEASE_CHECK=1`), and
# it does not exist at all on a machine that has never run that command. GitHub
# Pages then serves the branch DIRECTLY, with no build and no gate, so anything
# that slips past the hook is live for every user on their next app open.
#
# This project's most expensive documented failure — `ea6c74e`, "the change
# reached nobody" — was exactly a lapse of local discipline. A hook is a brace;
# this is the belt.
#
# IT INSTALLS A BROWSER, AND THAT IS THE POINT.
# Two suites (test-startup.js, test-sync-status-ui.js) need Playwright. Locally
# it is absent, so they throw MODULE_NOT_FOUND and are easy to read as noise —
# and THREE separate breaks hid behind that silence: v316 (`[data-my-meals]`),
# v322 (`[data-quantity]`) and v329's shopping rebuild, which this workflow's
# first real run is what finally caught. Here they always run, and
# `--strict` makes a skip a failure, so that blind spot cannot reopen.
#
# Playwright is installed with `--no-save`: it never enters package.json and
# never ships. The project's "no new dependencies" law is about the bundle the
# user downloads, and nothing here reaches it.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push while the first is still running makes the first answer stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: contracts + suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # Pinned, not "latest": the local runs these suites are verified against
      # are Node 24, and a runtime that moves on someone else's schedule is not
      # a control. Same reasoning as ios-build.yml pinning macos-26.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Its own step so a failure here is never mistaken for a failing test.
      # ⚠️ ONE `npm i --no-save` FOR EVERYTHING OUTSIDE package.json. An --no-save
      # install PRUNES every package the manifest does not list — so a second one
      # for eslint silently removed playwright, the browser suites read as
      # "needs an external runtime", and --strict would have failed the run for
      # a reason that looked like a missing browser. Measured locally first.
      # eslint@9 is PINNED and `globals` is named: an unpinned install resolved
      # ESLint 10, which no longer carries `globals` transitively, and the config
      # failed on a dependency nobody had declared. A tool that moves on someone
      # else's schedule is not a control — the same reason Node is pinned above.
      - name: Install Playwright + Chromium + ESLint
        run: |
          npm i --no-save playwright eslint@9 globals
          npx playwright install --with-deps chromium

      # Version markers, script order, i18n, the client-to-backend agreements.
      # This is the same check the pre-commit hook runs, now where it cannot be
      # skipped.
      # Every step below goes through scripts/ci-step.sh: on failure its output is
      # re-emitted as a check-run ANNOTATION, which is public — the run LOG is
      # admin-only (403 to everyone else). This workflow was red on all fifteen of
      # its runs before anyone could read WHY; the annotation is the fix for that.
      - name: Contracts
        run: bash scripts/ci-step.sh "contracts" npm run check

      # Same rule as Playwright: --no-save, never in package.json, never shipped
      # (installed in the step above, in the SAME command). --strict makes an
      # ABSENT linter a failure — an absence here means that install step lied,
      # and a linter that is not running looks exactly like one that found nothing.
      - name: Lint
        run: bash scripts/ci-step.sh "lint" node scripts/lint.js --strict

      # --strict: a suite that did not RUN is a failure here. Locally a missing
      # browser is a tolerable skip; in CI it means the install step lied.
      - name: Test suites
        run: bash scripts/ci-step.sh "suites" node scripts/test-all.js --strict

      # The release markers must agree with each other. `--check` does not
      # bump anything; it only reports disagreement.
      - name: Release markers agree
        run: bash scripts/ci-step.sh "release markers" npm run release:check
