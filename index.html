<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>THE VAULT</title>
  <!-- Critical inline paint: black background from the very first frame so a
       slow styles.css load never flashes unstyled white content (FOUC). -->
  <style>html,body{margin:0;background:#000;color:#fff}</style>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=99">
</head>
<body class="theme-dark">
  <div class="app">
    <main class="main">
      <section class="view active" data-view="home"></section>
      <section class="view" data-view="workouts"></section>
      <section class="view" data-view="library"></section>
      <section class="view" data-view="exercise-detail"></section>
      <section class="view" data-view="cardio"></section>
      <section class="view" data-view="food"></section>
      <section class="view" data-view="sleep"></section>
      <section class="view" data-view="compare"></section>
      <section class="view" data-view="settings"></section>
      <section class="view" data-view="planner"></section>
      <section class="view" data-view="calendar"></section>
      <section class="view" data-view="supplements"></section>
      <section class="view" data-view="foodlog"></section>
      <section class="view" data-view="session-day"></section>
      <section class="view" data-view="personal-records"></section>
    </main>

    <nav class="bottom-nav" id="bottom-nav">
      <button class="nav-btn" data-view="workouts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6"/><path d="M7 7v10"/><path d="M10 10v4"/><path d="M14 10v4"/><path d="M17 7v10"/><path d="M20 9v6"/><path d="M10 12h4"/></svg>
        <span data-t="nav_train">Train</span>
      </button>
      <button class="nav-btn" data-view="cardio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.5-1.5 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/><path d="M3.22 12H9.5l1.5-3 2 6 1.5-3h6.28"/></svg>
        <span data-t="nav_cardio">Cardio</span>
      </button>
      <button class="nav-btn home-center active" data-view="home">
        <div class="home-center-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12 12 3l9 9"/><path d="M5 10v10a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1V10"/></svg>
        </div>
        <span data-t="nav_home">Home</span>
      </button>
      <button class="nav-btn" data-view="food">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2v0a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
        <span data-t="nav_food">Food</span>
      </button>
      <button class="nav-btn" data-view="sleep">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
        <span data-t="nav_sleep">Sleep</span>
      </button>
    </nav>
  </div>

  <div class="modal-root" id="modal-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script>
    // Auto-cleanup: unregister any old service worker and clear old caches
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(async (regs) => {
        if (regs.length > 0) {
          await Promise.all(regs.map((r) => r.unregister()));
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
          if (!sessionStorage.getItem('__cleaned_v99')) {
            sessionStorage.setItem('__cleaned_v99', '1');
            location.reload();
          }
        }
      }).catch(() => {});
    }
  </script>
  <script src="js/cloud.js?v=99"></script>
  <script src="js/storage.js?v=99"></script>
  <script src="js/app.js?v=99"></script>
  <script src="js/health.js?v=99"></script>
  <script src="js/foodai.js?v=99"></script>
</body>
</html>
