<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Pinch-zoom stays ENABLED. `maximum-scale=1, user-scalable=no` blocked it
       app-wide, which on a UI with 10-12px labels leaves anyone with reduced
       vision no way to read a value (WCAG 1.4.4). The iOS "focus zoom" this
       usually guards against is prevented instead by the 16px input font-size
       rule in styles.css ("INPUTS") — see the note there before lowering it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>VAULT</title>
  <!-- Lighthouse flags a missing description as an SEO fail. It is also what a
       search result and a shared link preview actually show, so the app was
       being described by whatever text the crawler happened to scrape first. -->
  <meta name="description" content="VAULT — a workout and nutrition tracker. Plan a training rotation, log sets and cardio, scan food barcodes, and track calories, water, sleep and body weight. Works offline, in English and Arabic.">
  <!-- Critical inline paint: black background from the very first frame so a
       slow styles.css load never flashes unstyled white content (FOUC). -->
  <style>html,body{margin:0;background:#000;color:#fff}</style>
  <link rel="manifest" href="manifest.json">
  <!-- These carry ?v=N like every other asset: without it a browser that has
       already cached the favicon keeps serving the OLD mark forever, so an icon
       redesign reaches nobody. `npm run release` rewrites every ?v= in this
       file, so these stay in step automatically. -->
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg?v=268">
  <link rel="apple-touch-icon" href="icons/icon.svg?v=268">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Warm the Supabase connection (DNS + TLS) during page load so the first
       auth/sync call on login isn't paying a ~1s cold-start penalty. -->
  <link rel="preconnect" href="https://ilmusnuchqlpirywonzx.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://ilmusnuchqlpirywonzx.supabase.co">
  <!-- Preload the (large) Supabase SDK so it's ready by the time the login gate
       needs it, instead of blocking the gate on a cold download. -->
  <!-- Must carry the SAME ?v=N that cloud.js appends when it injects this script,
       or the preload warms a different URL and is wasted. `npm run release` bumps
       both (this one by regex, cloud.js by deriving from its own marker). -->
  <link rel="preload" href="js/vendor/supabase.js?v=268" as="script">
  <!-- The brand kit's three faces, and only three:
         IBM Plex Sans Arabic — the body face, for BOTH scripts (it carries a
           full Latin set, so this replaces the old Inter + Tajawal pair and one
           font now covers an EN/AR app instead of two).
         Archivo            — the VAULT wordmark ONLY (.bl-name), at 800.
         JetBrains Mono     — numerals and technical labels (.num).

       EVERY WEIGHT HERE IS ONE THE CSS ACTUALLY ASKS FOR. Fonts are the single
       heaviest thing this page loads — 8 files, ~208 KB, 38% of total transfer,
       more than app.js, styles.css and supabase.js combined — so an unused
       weight is not a rounding error. Three were being downloaded and never
       drawn (checked against document.fonts in the running app, not by reading
       the CSS): IBM Plex 300, and Archivo 600 and 900, both reported
       "unloaded" with .bl-name as Archivo's only consumer.

       JetBrains 700 is ADDED, not waste: .num elements inherit their weight
       from the row around them and were resolving to 700/800/900 against a face
       that only shipped 400 and 500, so 12 of the 14 numbers visible on Home
       were SYNTHETIC bold — the browser smearing 400 rather than drawing a real
       bold. With 700 present the heavier steps map to it instead. -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Archivo:wght@800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=268">
</head>
<body class="theme-dark">
  <div class="app">
    <main class="main">
      <section class="view active" data-view="home"></section>
      <section class="view" data-view="workouts"></section>
      <section class="view" data-view="exercises"></section>
      <section class="view" data-view="exercise-detail"></section>
      <section class="view" data-view="cardio"></section>
      <section class="view" data-view="food"></section>
      <section class="view" data-view="sleep"></section>
      <section class="view" data-view="compare"></section>
      <section class="view" data-view="settings"></section>
      <section class="view" data-view="planner"></section>
      <section class="view" data-view="calendar"></section>
      <section class="view" data-view="supplements"></section>
      <section class="view" data-view="foodlog"></section>
      <section class="view" data-view="session-day"></section>
      <section class="view" data-view="session-run"></section>
      <section class="view" data-view="personal-records"></section>
      <section class="view" data-view="muscle-sessions"></section>
      <section class="view" data-view="custom-exercises"></section>
      <!-- One day, everything: what was eaten, trained, weighed, drunk and slept.

      <section class="view" data-view="notifications"></section>

    </main>

    <nav class="bottom-nav" id="bottom-nav">

        <svg viewBox="0 0 24 24" fill="none"><rect x="6.8" y="1.8" width="2.6" height="4.4" rx="1.3" fill="currentColor"/><rect x="14.6" y="1.8" width="2.6" height="4.4" rx="1.3" fill="currentColor"/><path d="M2.6 9.6h18.8v8.4a3.4 3.4 0 0 1-3.4 3.4H6a3.4 3.4 0 0 1-3.4-3.4Z" fill="currentColor"/><path d="M6 4.2h12a3.4 3.4 0 0 1 3.4 3.4v2H2.6v-2A3.4 3.4 0 0 1 6 4.2Z" fill="var(--icon-accent,#ff6a00)"/></svg>
        <span data-t="nav_train">Program</span>
      </button>
      <button class="nav-btn" data-view="cardio">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 21.3S2.6 15.8 2.6 9.6a4.9 4.9 0 0 1 9.4-2 4.9 4.9 0 0 1 9.4 2c0 6.2-9.4 11.7-9.4 11.7Z" fill="currentColor"/><path d="M1.6 11h5.6l1.8-3 2.8 5.6 2-3.4h8.6v2.4h-7.2l-3.6 6-2.8-5.6-.6 1H1.6Z" fill="var(--icon-accent,#ff6a00)"/></svg>
        <span data-t="nav_cardio">Cardio</span>
      </button>
      <button class="nav-btn home-center active" data-view="home">
        <div class="home-center-icon">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2.6 1.8 11.2h3.4v10.2h13.6V11.2h3.4Z" fill="currentColor"/><path d="M9.2 21.4V15.4h5.6v6Z" fill="var(--icon-accent,#ff6a00)"/></svg>
        </div>
        <span data-t="nav_home">Home</span>
      </button>
      <button class="nav-btn" data-view="food">
        <svg viewBox="0 0 24 24" fill="none"><rect x="8.9" y="10.4" width="2.4" height="11" rx="1.2" fill="currentColor"/><path d="M17.8 21.4h-2.4v-7.6c-1.5-.5-2.4-2.2-2.4-4.8 0-3.6 1.7-6.2 3.4-6.2h1.4Z" fill="currentColor"/><path d="M6 2.6h1.9v4.6h1.2V2.6H11v4.6h1.2V2.6h1.9v5.2a4 4 0 0 1-8 0Z" fill="var(--icon-accent,#ff6a00)"/></svg>
        <span data-t="nav_food">Food</span>
      </button>
      <button class="nav-btn" data-view="sleep">
        <svg viewBox="0 0 24 24" fill="none"><path d="M21.4 15.2A9.4 9.4 0 0 1 8.8 2.6 9.4 9.4 0 1 0 21.4 15.2Z" fill="currentColor"/><circle cx="17.6" cy="5.2" r="1.7" fill="var(--icon-accent,#ff6a00)"/><circle cx="21" cy="9.8" r="1" fill="var(--icon-accent,#ff6a00)"/></svg>
        <span data-t="nav_sleep">Sleep</span>
      </button>
    </nav>
  </div>

  <div class="modal-root" id="modal-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script>
    // Auto-cleanup: unregister any old service worker and clear old caches
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(async (regs) => {
        if (regs.length > 0) {
          await Promise.all(regs.map((r) => r.unregister()));
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
          if (!sessionStorage.getItem('__cleaned_v268')) {
            sessionStorage.setItem('__cleaned_v268', '1');
            location.reload();
          }
        }
      }).catch(() => {});
    }
  </script>
  <script src="js/cloud.js?v=268"></script>
  <script src="js/storage.js?v=268"></script>
  <script src="js/tables.js?v=268"></script>
  <script src="js/app.js?v=268"></script>
  <script src="js/health.js?v=268"></script>
  <script src="js/notify.js?v=268"></script>
  <script src="js/foodai.js?v=268"></script>
  <script src="js/update.js?v=268"></script>
</body>
</html>
