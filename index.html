<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Pinch-zoom stays ENABLED. `maximum-scale=1, user-scalable=no` blocked it
       app-wide, which on a UI with 10-12px labels leaves anyone with reduced
       vision no way to read a value (WCAG 1.4.4). The iOS "focus zoom" this
       usually guards against is prevented instead by the 16px input font-size
       rule in styles.css ("INPUTS") — see the note there before lowering it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Content-Security-Policy. The session token lives in localStorage, so the
       cost of any future injection is account takeover; this bounds the blast
       radius. `frame-ancestors` is deliberately absent — it is IGNORED in a
       <meta> and needs a real header, which GitHub Pages cannot set.
       Read the comment block in scripts/check-contracts.js contract 29 before
       adding an origin: every host below was derived from the code. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://raw.githubusercontent.com https://ilmusnuchqlpirywonzx.supabase.co; media-src 'self' blob: data:; connect-src 'self' https://challenges.cloudflare.com https://ilmusnuchqlpirywonzx.supabase.co https://vault-calories.moathdarweesh2000.workers.dev https://world.openfoodfacts.org https://raw.githubusercontent.com; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>VAULT</title>
  <!-- Lighthouse flags a missing description as an SEO fail. It is also what a
       search result and a shared link preview actually show, so the app was
       being described by whatever text the crawler happened to scrape first. -->
  <meta name="description" content="VAULT — a workout and nutrition tracker. Plan a training rotation, log sets and cardio, scan food barcodes, and track calories, water, sleep and body weight. Works offline, in English and Arabic.">
  <!-- Critical inline paint: black background from the very first frame so a
       slow styles.css load never flashes unstyled white content (FOUC). -->
  <style>html,body{margin:0;background:#000;color:#fff}</style>
  <link rel="manifest" href="manifest.json?v=364">
  <!-- These carry ?v=N like every other asset: without it a browser that has
       already cached the favicon keeps serving the OLD mark forever, so an icon
       redesign reaches nobody. `npm run release` rewrites every ?v= in this
       file, so these stay in step automatically. -->
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg?v=364">
  <!-- iOS does NOT support SVG for apple-touch-icon: Safari ignores it and puts a
       SCREENSHOT of the page on the Home Screen instead of the mark. This PNG is
       rendered from icons/icon.svg on an opaque black tile (iOS applies its own
       squircle mask and does not expect alpha). rel=icon below stays SVG for
       desktop browsers, which do support it. -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png?v=364">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Warm the Supabase connection (DNS + TLS) during page load so the first
       auth/sync call on login isn't paying a ~1s cold-start penalty. -->
  <link rel="preconnect" href="https://ilmusnuchqlpirywonzx.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://ilmusnuchqlpirywonzx.supabase.co">
  <!-- Preload the (large) Supabase SDK so it's ready by the time the login gate
       needs it, instead of blocking the gate on a cold download. -->
  <!-- Must carry the SAME ?v=N that cloud.js appends when it injects this script,
       or the preload warms a different URL and is wasted. `npm run release` bumps
       both (this one by regex, cloud.js by deriving from its own marker). -->
  <link rel="preload" href="js/vendor/supabase.js?v=364" as="script">
  <!-- Discover startup files before the first inline body script waits for CSS.
       Download together; defer preserves dependency order and waits for the DOM. -->
  <script src="js/i18n.js?v=364" defer></script>
  <script src="js/catalog.js?v=364" defer></script>
  <script src="js/cloud.js?v=364" defer></script>
  <script src="js/storage.js?v=364" defer></script>
  <!-- Motion primitives. No dependencies of its own; it only has to be here
       before app.js, which calls VltMotion from its render paths. -->
  <script src="js/motion.js?v=364" defer></script>
  <!-- The presentation vocabulary: format, escape, select, and the shared
       surfaces (toast, modal, confirm, lightbox). The floor of the call
       graph — the two view scripts below are written in it. -->
  <script src="js/ui.js?v=364" defer></script>
  <!-- The body domain: sleep, body weight and cardio. Three day-entry screens
       that share one day-ledger renderer. No top-level statement and no edge
       into another domain, so its place in the order is free. -->
  <script src="js/body.js?v=364" defer></script>
  <!-- The food domain. BEFORE app.js, not after: bootCatalog() calls
       setServerFoodCatalog() inside a bare catch, so loading it later means a
       swallowed ReferenceError and a server food catalog that silently never
       merges. It has no top-level dependency of its own. -->
  <script src="js/food.js?v=364" defer></script>
  <script src="js/app.js?v=364" defer></script>
  <script src="js/health.js?v=364" defer></script>
  <script src="js/notify.js?v=364" defer></script>
  <script src="js/foodai.js?v=364" defer></script>
  <script src="js/update.js?v=364" defer></script>
  <!-- The brand kit's three faces, and only three:
         IBM Plex Sans Arabic — the body face, for BOTH scripts (it carries a
           full Latin set, so this replaces the old Inter + Tajawal pair and one
           font now covers an EN/AR app instead of two).
         Archivo            — the VAULT wordmark ONLY (.bl-name), at 800.
         JetBrains Mono     — numerals and technical labels (.num).

       EVERY WEIGHT HERE IS ONE THE CSS ACTUALLY ASKS FOR. Fonts are the single
       heaviest thing this page loads — 8 files, ~208 KB, 38% of total transfer,
       more than app.js, styles.css and supabase.js combined — so an unused
       weight is not a rounding error. Three were being downloaded and never
       drawn (checked against document.fonts in the running app, not by reading
       the CSS): IBM Plex 300, and Archivo 600 and 900, both reported
       "unloaded" with .bl-name as Archivo's only consumer.

       JetBrains 700 is ADDED, not waste: .num elements inherit their weight
       from the row around them and were resolving to 700/800/900 against a face
       that only shipped 400 and 500, so 12 of the 14 numbers visible on Home
       were SYNTHETIC bold — the browser smearing 400 rather than drawing a real
       bold. With 700 present the heavier steps map to it instead. -->
  <!-- NON-BLOCKING. A plain stylesheet link here held first paint until
       fonts.googleapis.com answered — the black page every cold start began
       with, and on a flaky gym connection a black page that stayed. Loaded as
       print media (which does not block render) and promoted on load; text
       draws in the fallback stack meanwhile and swaps in (display=swap).
       display=optional was tried in v296 and dropped: with this async-promoted
       sheet Chrome parks the faces on the fallback for the whole session on
       roughly one launch in four. One reflow beats no brand font. -->
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Archivo:wght@800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Archivo:wght@800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="styles.css?v=364">
</head>
<body class="theme-dark">
  <script>
    // BEFORE FIRST PAINT: theme, direction and nav labels from a mirror of prefs
    // (js/storage.js mirrorUi), so a light-theme or Arabic user never sees the
    // black, English, left-to-right frame while the scripts below still load.
    (function () {
      try {
        var ui = JSON.parse(localStorage.getItem('vault_ui') || 'null');
        if (!ui) return;
        if (/^[a-z]+$/.test(ui.theme || '')) {
          document.body.className = 'theme-' + ui.theme;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', ui.theme === 'light' ? '#faf5f0' : '#000000');
        }
        if (ui.lang === 'ar' || ui.lang === 'en') {
          document.documentElement.lang = ui.lang;
          document.body.setAttribute('dir', ui.lang === 'ar' ? 'rtl' : 'ltr');
        }
        window.__navLabels = ui.nav || null;
      } catch (_) {}
    })();
  </script>
  <!-- THE SPLASH — the vault door. Frame 1 of this element is frame 0 of the
       fourteen native launch images, so the handover from the Android window
       background to the WebView has nothing to cross. It is markup rather than
       something a script builds because it must be painted in the SAME frame
       as the page: styles.css is render-blocking, so the door and the first
       paint arrive together and there is never an unpainted shell behind it.

       The mark is duplicated once per leaf on purpose — the light sits BEHIND
       the door, so it has to be cut at the same seam. See styles.css section 8. -->
  <div class="vs" id="splash" aria-hidden="true">
    <div class="vs-leaf vs-leaf-t"><div class="vs-face">
      <div class="vs-bloom"></div>
      <div class="vs-mark">
        <div class="vs-bolts">
          <span class="vs-bolt vs-n1"></span><span class="vs-bolt vs-n2"></span>
          <span class="vs-bolt vs-mid"></span>
          <span class="vs-bolt vs-n4"></span><span class="vs-bolt vs-n5"></span>
        </div>
        <div class="vs-word">VAULT</div>
      </div>
    </div></div>
    <div class="vs-leaf vs-leaf-b"><div class="vs-face">
      <div class="vs-bloom"></div>
      <div class="vs-mark">
        <div class="vs-bolts">
          <span class="vs-bolt vs-n1"></span><span class="vs-bolt vs-n2"></span>
          <span class="vs-bolt vs-mid"></span>
          <span class="vs-bolt vs-n4"></span><span class="vs-bolt vs-n5"></span>
        </div>
        <div class="vs-word">VAULT</div>
      </div>
    </div></div>
  </div>
  <noscript><style>.vs { display: none; }</style></noscript>
  <script>
    // THE DOOR'S CLOCK. Inline and at parse time on purpose: a deferred script
    // would start the sequence after ten other files have executed, and the
    // whole point is that the first painted frame is already the right one.
    (function () {
      var el = document.getElementById('splash');
      if (!el) return;
      var skip = false;
      try { skip = matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (_) {}
      // An AUTOMATIC reload must not replay it. js/update.js reloads the entry
      // html with ?u= when a new web build exists, and the service-worker
      // cleanup below reloads once too — both inside a couple of seconds, and
      // both would otherwise show the door twice in one launch. A deliberate
      // refresh a minute later is a relaunch and still gets it.
      try {
        var prev = +(sessionStorage.getItem('__splash_v1') || 0);
        if (prev && Date.now() - prev < 10000) skip = true;
        sessionStorage.setItem('__splash_v1', String(Date.now()));
      } catch (_) {}
      if (skip) { el.remove(); return; }

      // Tells app.js to hold its first stagger: the cards must rise as the door
      // parts, not 1.7s earlier behind a closed one.
      window.__vltSplash = 1;
      // The pre-paint script above may already have set theme-color to the bone
      // ground for a light-theme user. The door is black on every theme, so the
      // status bar has to be told that for as long as the door is up; applyTheme
      // keeps it there and the teardown below hands it back.
      try {
        var tc = document.querySelector('meta[name="theme-color"]');
        if (tc) tc.setAttribute('content', '#000000');
      } catch (_) {}
      // Start Archivo as early as it can be started. Left alone the face is
      // discovered only when the non-blocking font stylesheet is promoted — two
      // sequential round trips AFTER first paint — and the wordmark is due at
      // 1650ms.
      //
      // ⚠️ AND BE HONEST ABOUT WHAT THIS BUYS. The call at parse time fetches
      // NOTHING: the Google Fonts sheet is still media="print" then, its
      // @font-face rules are not in the screen font source, and fonts.load()
      // resolves against an empty match list without requesting anything. It is
      // re-armed when that sheet lands and once more on a timer — but `.vs-word`
      // is rendered (opacity 0, not display:none), so the browser asks for
      // Archivo at the first style recalc after the promotion anyway. This is a
      // belt, not a shortcut: the only thing that would actually beat the two
      // round trips is self-hosting a five-glyph subset, which the CSP already
      // permits. On a cold cache the wordmark can still draw in the fallback.
      function warmFont() {
        try { if (document.fonts && document.fonts.load) document.fonts.load('800 38px Archivo', 'VAULT'); } catch (_) {}
      }
      warmFont();
      try { var fl = document.querySelector('link[href*="fonts.googleapis.com"]');
           if (fl) fl.addEventListener('load', warmFont); } catch (_) {}
      setTimeout(warmFont, 250);

      el.classList.add('vs-a');

      // ⚠️ performance.now(), NOT Date.now(). The wall clock can be corrected
      // backwards mid-boot (NTP, a timezone-aware device waking up), and this
      // clock decides both when the door may open and when it MUST. A backward
      // jump on a wall clock holds the door shut past its own cap.
      var CAP = 2500, t0 = performance.now();
      function open() {
        el.classList.add('vs-b');
        // ⚠️ THE DOOR KEEPS EATING TAPS UNTIL IT IS GONE. An earlier draft went
        // pointer-transparent here, at the START of phase B — but the leaves do
        // not begin to move for another 400ms and are not clear of the screen
        // for 1100ms, so for most of a second a tap passed THROUGH a closed
        // door onto controls the user could not see. The node is removed 50ms
        // after the swing ends, which is the moment the app really is reachable.
        setTimeout(function () {
          window.__vltSplash = 0;
          try {
            var host = window.__vltSplashHost;
            if (host && host.isConnected && window.VltMotion) VltMotion.stagger(host);
          } catch (_) {}
          window.__vltSplashHost = null;
        }, 400);                            // the leaves start; the cards rise with them
        setTimeout(function () {
          el.remove();
          // Hand the status bar back. applyTheme is idempotent and is the only
          // writer of both surfaces, so re-running it is the whole restore —
          // and it now sees no #splash, so it writes the user's real theme.
          try { if (window.applyTheme && window.DB) applyTheme(DB.prefs.get().theme); } catch (_) {}
        }, 1150);
      }
      // The dwell is where a slow launch waits. Never on animationend — it does
      // not fire in a hidden document, and a door that never opens is worse
      // than one that opens early.
      (function tick() {
        setTimeout(function () {
          if (window.__vltReady || performance.now() - t0 > CAP) open();
          else tick();
        }, performance.now() - t0 < 1300 ? 1300 - (performance.now() - t0) : 60);
      })();
    })();
  </script>
  <div class="app">
    <main class="main">
      <section class="view active" data-view="home"></section>
      <section class="view" data-view="workouts"></section>
      <section class="view" data-view="exercises"></section>

      <section class="view" data-view="session-day"></section>

      <section class="view" data-view="personal-records"></section>

           Reached from the 7-day strip on Home and from the calendar. -->
      <section class="view" data-view="notifications"></section>
      <section class="view" data-view="day"></section>
    </main>
    <!-- The Food "+" lives HERE, outside the fading .view (its entrance transform
         would otherwise be the containing block and the button snapped into place
         200 ms after every open). Shown only on Food; filled and bound by renderFood. -->
    <button class="food-fab" id="food-fab" type="button" aria-label="Add"></button>

    <nav class="bottom-nav" id="bottom-nav">
      <!-- The Program tab (view id 'workouts' — kept because it is in users'
           pushState history). Icon is a schedule, not a dumbbell: this tab is the
           cycle + weekly volume + records, and starting a workout lives on Home. -->
      <button class="nav-btn" data-view="workouts">
        <svg viewBox="0 0 24 24" fill="none"><rect x="6.8" y="1.8" width="2.6" height="4.4" rx="1.3" fill="currentColor"/><rect x="14.6" y="1.8" width="2.6" height="4.4" rx="1.3" fill="currentColor"/><path d="M2.6 9.6h18.8v8.4a3.4 3.4 0 0 1-3.4 3.4H6a3.4 3.4 0 0 1-3.4-3.4Z" fill="currentColor"/><path d="M6 4.2h12a3.4 3.4 0 0 1 3.4 3.4v2H2.6v-2A3.4 3.4 0 0 1 6 4.2Z" fill="var(--icon-accent,#ff6a00)"/></svg>
        <span data-t="nav_train">Program</span>
      </button>
      <button class="nav-btn" data-view="cardio">
        <svg viewBox="0 0 24 24" fill="none"><path d="M12 21.3S2.6 15.8 2.6 9.6a4.9 4.9 0 0 1 9.4-2 4.9 4.9 0 0 1 9.4 2c0 6.2-9.4 11.7-9.4 11.7Z" fill="currentColor"/><path d="M1.6 11h5.6l1.8-3 2.8 5.6 2-3.4h8.6v2.4h-7.2l-3.6 6-2.8-5.6-.6 1H1.6Z" fill="var(--icon-accent,#ff6a00)"/></svg>
        <span data-t="nav_cardio">Cardio</span>
      </button>
      <button class="nav-btn home-center active" data-view="home">
        <div class="home-center-icon">
          <svg viewBox="0 0 24 24" fill="none"><path d="M12 2.6 1.8 11.2h3.4v10.2h13.6V11.2h3.4Z" fill="currentColor"/><path d="M9.2 21.4V15.4h5.6v6Z" fill="var(--icon-accent,#ff6a00)"/></svg>
        </div>
        <span data-t="nav_home">Home</span>
      </button>
      <button class="nav-btn" data-view="food">
        <svg viewBox="0 0 24 24" fill="none"><rect x="8.9" y="10.4" width="2.4" height="11" rx="1.2" fill="currentColor"/><path d="M17.8 21.4h-2.4v-7.6c-1.5-.5-2.4-2.2-2.4-4.8 0-3.6 1.7-6.2 3.4-6.2h1.4Z" fill="currentColor"/><path d="M6 2.6h1.9v4.6h1.2V2.6H11v4.6h1.2V2.6h1.9v5.2a4 4 0 0 1-8 0Z" fill="var(--icon-accent,#ff6a00)"/></svg>
        <span data-t="nav_food">Food</span>
      </button>
      <button class="nav-btn" data-view="sleep">
        <svg viewBox="0 0 24 24" fill="none"><path d="M21.4 15.2A9.4 9.4 0 0 1 8.8 2.6 9.4 9.4 0 1 0 21.4 15.2Z" fill="currentColor"/><circle cx="17.6" cy="5.2" r="1.7" fill="var(--icon-accent,#ff6a00)"/><circle cx="21" cy="9.8" r="1" fill="var(--icon-accent,#ff6a00)"/></svg>
        <span data-t="nav_sleep">Sleep</span>
      </button>
    </nav>
    <script>
      // The nav above is static HTML; label it in the mirrored language before
      // it paints (app.js re-labels through t() once it loads).
      try { if (window.__navLabels) document.querySelectorAll('[data-t]').forEach(function (el) { var v = window.__navLabels[el.getAttribute('data-t')]; if (v) el.textContent = v; }); } catch (_) {}
    </script>
  </div>

  <div class="modal-root" id="modal-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script>
    // Auto-cleanup: unregister any old service worker and clear old caches
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(async (regs) => {
        if (regs.length > 0) {
          await Promise.all(regs.map((r) => r.unregister()));
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
          if (!sessionStorage.getItem('__cleaned_v364')) {
            sessionStorage.setItem('__cleaned_v364', '1');
            location.reload();
          }
        }
      }).catch(() => {});
    }
  </script>
</body>
