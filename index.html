<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Pinch-zoom stays ENABLED. `maximum-scale=1, user-scalable=no` blocked it
       app-wide, which on a UI with 10-12px labels leaves anyone with reduced
       vision no way to read a value (WCAG 1.4.4). The iOS "focus zoom" this
       usually guards against is prevented instead by the 16px input font-size
       rule in styles.css ("INPUTS") — see the note there before lowering it. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>THE VAULT</title>
  <!-- Critical inline paint: black background from the very first frame so a
       slow styles.css load never flashes unstyled white content (FOUC). -->
  <style>html,body{margin:0;background:#000;color:#fff}</style>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Warm the Supabase connection (DNS + TLS) during page load so the first
       auth/sync call on login isn't paying a ~1s cold-start penalty. -->
  <link rel="preconnect" href="https://ilmusnuchqlpirywonzx.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://ilmusnuchqlpirywonzx.supabase.co">
  <!-- Preload the (large) Supabase SDK so it's ready by the time the login gate
       needs it, instead of blocking the gate on a cold download. -->
  <!-- Must carry the SAME ?v=N that cloud.js appends when it injects this script,
       or the preload warms a different URL and is wasted. `npm run release` bumps
       both (this one by regex, cloud.js by deriving from its own marker). -->
  <link rel="preload" href="js/vendor/supabase.js?v=203" as="script">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=203">
</head>
<body class="theme-dark">
  <div class="app">
    <main class="main">
      <section class="view active" data-view="home"></section>
      <section class="view" data-view="workouts"></section>
      <section class="view" data-view="exercises"></section>
      <section class="view" data-view="exercise-detail"></section>
      <section class="view" data-view="cardio"></section>
      <section class="view" data-view="food"></section>
      <section class="view" data-view="sleep"></section>
      <section class="view" data-view="compare"></section>
      <section class="view" data-view="settings"></section>
      <section class="view" data-view="planner"></section>
      <section class="view" data-view="calendar"></section>
      <section class="view" data-view="supplements"></section>
      <section class="view" data-view="foodlog"></section>
      <section class="view" data-view="session-day"></section>
      <section class="view" data-view="session-run"></section>
      <section class="view" data-view="personal-records"></section>
      <section class="view" data-view="muscle-sessions"></section>
      <section class="view" data-view="custom-exercises"></section>
    </main>

    <nav class="bottom-nav" id="bottom-nav">
      <!-- The Program tab (view id 'workouts' — kept because it is in users'
           pushState history). Icon is a schedule, not a dumbbell: this tab is the
           cycle + weekly volume + records, and starting a workout lives on Home. -->
      <button class="nav-btn" data-view="workouts">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"><rect x="4" y="6" width="16" height="14" rx="2"/><path d="M4 10h16"/><path d="M8 4v4"/><path d="M16 4v4"/></svg>
        <span data-t="nav_train">Program</span>
      </button>
      <button class="nav-btn" data-view="cardio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-miterlimit="4"><path d="M4 10a4 4 0 0 1 8 0 4 4 0 0 1 8 0l-8 8Z"/><path d="M2 12h6l2-2 4 4 2-2h6"/></svg>
        <span data-t="nav_cardio">Cardio</span>
      </button>
      <button class="nav-btn home-center active" data-view="home">
        <div class="home-center-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"><path d="M4 12 12 4l8 8"/><path d="M6 10v10h12V10"/><path d="M10 20v-6h4v6"/></svg>
        </div>
        <span data-t="nav_home">Home</span>
      </button>
      <button class="nav-btn" data-view="food">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"><path d="M6 4v6h4V4"/><path d="M8 10v10"/><path d="M18 4v16"/><path d="M18 4l-4 4v4h4"/></svg>
        <span data-t="nav_food">Food</span>
      </button>
      <button class="nav-btn" data-view="sleep">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4"><path d="M20 14a8 8 0 1 1-10-10 8 8 0 0 0 10 10Z"/></svg>
        <span data-t="nav_sleep">Sleep</span>
      </button>
    </nav>
  </div>

  <div class="modal-root" id="modal-root"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script>
    // Auto-cleanup: unregister any old service worker and clear old caches
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(async (regs) => {
        if (regs.length > 0) {
          await Promise.all(regs.map((r) => r.unregister()));
          const keys = await caches.keys();
          await Promise.all(keys.map((k) => caches.delete(k)));
          if (!sessionStorage.getItem('__cleaned_v203')) {
            sessionStorage.setItem('__cleaned_v203', '1');
            location.reload();
          }
        }
      }).catch(() => {});
    }
  </script>
  <script src="js/cloud.js?v=203"></script>
  <script src="js/storage.js?v=203"></script>
  <script src="js/tables.js?v=203"></script>
  <script src="js/app.js?v=203"></script>
  <script src="js/health.js?v=203"></script>
  <script src="js/foodai.js?v=203"></script>
  <script src="js/update.js?v=203"></script>
</body>
</html>
