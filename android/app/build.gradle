import org.jetbrains.kotlin.gradle.dsl.JvmTarget

apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace = "com.moath.thevault"
    compileSdk = rootProject.ext.compileSdkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    defaultConfig {
        applicationId "com.moath.thevault"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 24
        versionName "3.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        /* ⚠️ THE SHIPPED APK WAS DEBUGGABLE. Read back out of build 22 with
           `aapt2 dump xmltree`: android:debuggable=true sat next to
           android:allowBackup=false — and it VOIDS it. `adb run-as` and
           chrome://inspect both work on a debuggable app, so the WebView
           storage the backup flag was added to protect (v302) was reachable
           anyway with the phone unlocked and USB debugging on.

           AGP sets this implicitly for the debug type; nothing in this file ever
           declared it. The debug signingConfig is KEPT on purpose — build 23
           must install over build 22 without an uninstall, or the device-local
           photo side store and the notification log go with it. */
        debug {
            debuggable false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// kotlinOptions {} is deprecated from Kotlin 2.0; the compilerOptions DSL replaces it.
kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.fromTarget('21')
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // Health Connect — read steps, heart rate, oxygen and sleep from Samsung Health.
    implementation "androidx.health.connect:connect-client:1.1.0"
    // 1.9.0, not 1.8.1: androidx.credentials 1.6.0 requires kotlinx-coroutines-core 1.9.0 at runtime.
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"

    // Native Google sign-in (GoogleSignInPlugin.kt): Credential Manager + the Google ID option.
    // googleid is declared at 1.2.1 on purpose: credentials-play-services-auth 1.6.0 pulls
    // googleid 1.1.0 transitively, and the explicit line is what makes 1.2.1 win.
    // Google Play services arrive transitively; no google-services.json, no Firebase.
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.2.1"

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
