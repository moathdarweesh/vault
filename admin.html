<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE VAULT — لوحة التحكّم</title>
<style>
  :root{
    --bg:#08080a; --surface:#141418; --surface-2:#1b1b21; --line:#26262e;
    --accent:#5b8def; --accent-soft:rgba(91,141,239,.14); --accent-ink:#04122e;
    --text:#f4f4f7; --dim:#9a9aa6; --mute:#6b6b76; --good:#4fd1a5; --warn:#f0b45b; --red:#ef6f6f;
    --chest:#ef6f6f; --back:#5b8def; --legs:#f0b45b; --shoulders:#b07be0; --arms:#4fd1a5; --core:#e0709a; --other:#9a9aa6;
    --radius:18px; --radius-sm:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:
    radial-gradient(1000px 560px at 100% -10%, rgba(91,141,239,.10), transparent 60%), var(--bg);
    color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.55; min-height:100vh}
  .num{font-variant-numeric:tabular-nums; unicode-bidi:plaintext}
  button{font-family:inherit; cursor:pointer}
  .hidden{display:none !important}

  /* login */
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:30px; width:100%; max-width:390px}
  .brand{display:flex; align-items:center; gap:10px; font-weight:900; letter-spacing:-.01em; font-size:20px}
  .brand .v{display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:10px; background:var(--accent); color:var(--accent-ink); font-size:18px}
  .card h1{font-size:19px; font-weight:800; margin:14px 0 4px}
  .card p.sub{color:var(--dim); font-size:14px; margin:0 0 20px}
  label{display:block; font-size:12.5px; font-weight:700; color:var(--dim); margin:0 0 6px}
  input{width:100%; padding:12px 14px; background:var(--surface-2); border:1px solid var(--line); border-radius:11px; color:var(--text); font-size:15px; outline:none; margin-bottom:14px; transition:border-color .15s}
  input:focus{border-color:var(--accent)}
  .btn{width:100%; padding:13px; border:none; border-radius:12px; background:var(--accent); color:var(--accent-ink); font-size:15px; font-weight:800; transition:filter .15s, transform .12s}
  .btn:active{transform:scale(.98)} .btn:disabled{opacity:.55; cursor:default}
  .msg{font-size:13px; margin-top:12px; min-height:18px; text-align:center}
  .msg.err{color:var(--red)} .msg.ok{color:var(--good)}

  /* shell */
  .wrap{max-width:1120px; margin:0 auto; padding:clamp(18px,4vw,40px) clamp(14px,3.5vw,28px) 70px}
  .top{display:flex; align-items:center; gap:14px; margin-bottom:6px; flex-wrap:wrap}
  .top .who{color:var(--dim); font-size:13px; margin-inline-start:auto}
  .top .out{background:transparent; border:1px solid var(--line); color:var(--dim); border-radius:10px; padding:8px 14px; font-size:13px; font-weight:700}
  .top .out:hover{color:var(--text); border-color:var(--dim)}
  .eyebrow{color:var(--accent); font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; margin:16px 0 4px}
  h2.title{font-size:clamp(24px,4.5vw,34px); font-weight:900; letter-spacing:-.02em; margin:0 0 22px}

  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:30px}
  .tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px}
  .tile .n{font-size:clamp(24px,4vw,34px); font-weight:900; letter-spacing:-.02em; line-height:1}
  .tile .k{color:var(--dim); font-size:12.5px; margin-top:7px; font-weight:600}
  .tile.alt .n{color:var(--accent)}

  .sec-head{display:flex; align-items:baseline; gap:12px; margin:0 0 14px}
  .sec-head h3{font-size:17px; font-weight:800; margin:0}
  .sec-head .rule{flex:1; height:1px; background:var(--line)}
  .sec-head .refresh{background:transparent; border:1px solid var(--line); color:var(--dim); border-radius:9px; padding:6px 12px; font-size:12px; font-weight:700}
  .sec-head .refresh:hover{color:var(--text)}

  .table-wrap{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
  .scroll-x{overflow-x:auto}
  .tbl{width:100%; border-collapse:collapse; min-width:680px}
  .tbl th{text-align:start; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--mute); padding:13px 16px; background:var(--surface-2); border-bottom:1px solid var(--line); white-space:nowrap}
  .tbl td{padding:12px 16px; border-bottom:1px solid #1e1e25; font-size:14px}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tbody tr{cursor:pointer; transition:background .12s}
  .tbl tbody tr:hover td{background:rgba(91,141,239,.06)}
  .uname{font-weight:800; display:flex; align-items:center; gap:9px}
  .av{width:30px; height:30px; border-radius:9px; background:var(--accent-soft); color:var(--accent); display:inline-flex; align-items:center; justify-content:center; font-weight:900; font-size:13px; flex-shrink:0}
  .handle{color:var(--accent)} .noname{color:var(--mute); font-weight:600}
  .pill{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:800; background:var(--surface-2); border:1px solid var(--line)}
  .pill.you{background:var(--accent-soft); border-color:transparent; color:var(--accent)}
  .chev{color:var(--mute)}
  .center{text-align:center; color:var(--dim); padding:40px 16px; font-size:14px}
  .muted{color:var(--mute)}

  /* detail overlay */
  .detail{position:fixed; inset:0; background:var(--bg); z-index:50; overflow-y:auto; display:none}
  .detail.show{display:block; animation:fade .25s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .detail-inner{max-width:1000px; margin:0 auto; padding:clamp(16px,4vw,36px) clamp(14px,3.5vw,28px) 80px}
  .d-top{display:flex; align-items:center; gap:14px; margin-bottom:18px; flex-wrap:wrap}
  .d-back{background:var(--surface); border:1px solid var(--line); color:var(--text); border-radius:11px; padding:9px 15px; font-size:14px; font-weight:700}
  .d-back:hover{border-color:var(--dim)}
  .d-id{color:var(--mute); font-size:12px; margin-inline-start:auto; direction:ltr}
  .d-title{display:flex; align-items:center; gap:12px; margin-bottom:20px}
  .d-title .av{width:46px; height:46px; border-radius:13px; font-size:19px}
  .d-title .name{font-size:clamp(22px,4vw,30px); font-weight:900; letter-spacing:-.02em}
  .d-title .name .noname{font-size:.7em}

  .dsec{margin-top:30px}
  .plan{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
  .day{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px}
  .day-name{font-weight:800; font-size:15px; margin-bottom:10px}
  .day ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
  .day li{display:flex; align-items:center; gap:8px; font-size:13.5px; color:#dcdce2}
  .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

  .log{display:flex; flex-direction:column; gap:12px}
  .daygrp{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
  .daygrp-h{display:flex; align-items:center; gap:10px; padding:11px 16px; background:var(--surface-2); border-bottom:1px solid var(--line)}
  .daygrp-date{font-weight:800; font-size:13.5px; direction:ltr}
  .daygrp-meta{color:var(--mute); font-size:12px; font-weight:700; margin-inline-start:auto}
  .ex{display:flex; align-items:center; gap:12px; padding:11px 16px; border-bottom:1px solid #1e1e25; flex-wrap:wrap}
  .ex:last-child{border-bottom:none}
  .ex-name{font-weight:700; font-size:14px; display:flex; align-items:center; gap:8px}
  .ex-name .tag{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .sets{display:flex; flex-wrap:wrap; gap:6px; margin-inline-start:auto}
  .set{direction:ltr; font-size:12px; font-weight:700; color:#d7d7de; background:#101015; border:1px solid var(--line); border-radius:8px; padding:3px 8px}
  .set b{color:var(--accent)}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{display:inline-flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:7px 13px; font-size:13px; font-weight:700}
  .chip .tag{width:8px;height:8px;border-radius:50%}
  .rows2{display:flex; flex-direction:column; gap:8px}
  .row2{display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:11px 15px; font-size:14px}
  .row2 .r-name{font-weight:700} .row2 .r-meta{color:var(--dim); font-size:12px; margin-inline-start:auto; direction:ltr}
  .row2 .r-val{color:var(--accent); font-weight:800}
  .empty-mini{color:var(--mute); font-size:13px; padding:10px 2px}

  footer{margin-top:30px; color:var(--mute); font-size:12.5px; display:flex; gap:8px 14px; flex-wrap:wrap; align-items:center}
  .badge{display:inline-flex; align-items:center; gap:7px; color:var(--good); font-weight:700}
  .badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}

  @media (max-width:720px){ .stats{grid-template-columns:repeat(2,1fr)} .plan{grid-template-columns:1fr} }
  @media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}
</style>
</head>
<body>

  <div id="login" class="login-wrap">
    <form class="card" id="login-form" autocomplete="on">
      <div class="brand"><span class="v">🏋️</span> THE VAULT</div>
      <h1>لوحة التحكّم</h1>
      <p class="sub">سجّل دخولك بحساب المالك لإدارة كل المستخدمين وبياناتهم.</p>
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" placeholder="بريدك" autocomplete="username" required>
      <label for="pass">كلمة السر</label>
      <input id="pass" type="password" placeholder="كلمة السر" autocomplete="current-password" required>
      <button class="btn" id="login-btn" type="submit">تسجيل الدخول</button>
      <div class="msg" id="login-msg"></div>
    </form>
  </div>

  <div id="dash" class="wrap hidden">
    <div class="top">
      <div class="brand"><span class="v">🏋️</span> THE VAULT</div>
      <span class="who" id="who"></span>
      <button class="out" id="logout">خروج</button>
    </div>
    <div class="eyebrow">لوحة التحكّم</div>
    <h2 class="title">المستخدمون وبياناتهم</h2>
    <div class="stats" id="stats"></div>
    <div class="sec-head"><h3>كل المستخدمين</h3><span class="rule"></span><button class="refresh" id="refresh">↻ تحديث</button></div>
    <div class="table-wrap"><div class="scroll-x"><table class="tbl">
      <thead><tr>
        <th>المستخدم</th><th>الجلسات</th><th>المجموعات</th><th>تمارين خاصة</th><th>وجبات</th><th>نوم</th><th>آخر نشاط</th><th></th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="8" class="center">جارٍ التحميل…</td></tr></tbody>
    </table></div></div>
    <footer>
      <span class="badge">مباشر من قاعدة البيانات</span><span>·</span>
      <span>صلاحية الأدمِن (RLS)</span><span>·</span><span id="foot-count"></span>
    </footer>
  </div>

  <!-- per-user detail -->
  <div id="detail" class="detail"><div class="detail-inner" id="detail-inner"></div></div>

  <script src="js/vendor/supabase.js"></script>
  <script>
  (function(){
    'use strict';
    var SUPABASE_URL='https://ilmusnuchqlpirywonzx.supabase.co';
    var SUPABASE_KEY='sb_publishable_ZBR2VENMP2O_K2YTMePCsw_NfLC9FSI';
    var sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
    var $=function(s){return document.querySelector(s);};
    function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
    function shortId(id){return String(id||'').slice(0,8);}
    var CAT={Chest:'chest',Back:'back',Legs:'legs',Shoulders:'shoulders',Arms:'arms',Core:'core'};
    function catColor(c){return 'var(--'+(CAT[c]||'other')+')';}
    function initial(u){return u.username?u.username[0].toUpperCase():'؟';}
    function nameHtml(u){return u.username?'<span class="handle">@'+esc(u.username)+'</span>':'<span class="noname">'+esc(shortId(u.id))+'…</span>';}

    var exMap={};      // id -> {name,category}
    var meId=null;
    var usersById={};

    function exName(id){return exMap[id]?exMap[id].name:'—';}
    function exCat(id){return exMap[id]?exMap[id].category:'Other';}

    function showLogin(){$('#login').classList.remove('hidden');$('#dash').classList.add('hidden');}
    function showDash(){$('#login').classList.add('hidden');$('#dash').classList.remove('hidden');}

    async function checkAdminAndLoad(){
      var msg=$('#login-msg');
      try{
        var r=await sb.rpc('is_admin');
        if(r.error) throw r.error;
        if(r.data===true){
          var s=await sb.auth.getSession();
          var u=s&&s.data&&s.data.session?s.data.session.user:null;
          meId=u?u.id:null;
          $('#who').textContent=u?('مسجّل: '+u.email):'';
          showDash(); loadOverview();
        }else{
          await sb.auth.signOut();
          msg.className='msg err'; msg.textContent='هذا الحساب ليس أدمِن. لوحة التحكّم للمالك فقط.'; showLogin();
        }
      }catch(e){ msg.className='msg err'; msg.textContent='تعذّر التحقّق: '+(e.message||e); showLogin(); }
    }

    $('#login-form').addEventListener('submit',async function(e){
      e.preventDefault();
      var btn=$('#login-btn'),msg=$('#login-msg');
      btn.disabled=true; msg.className='msg'; msg.textContent='جارٍ تسجيل الدخول…';
      var r=await sb.auth.signInWithPassword({email:$('#email').value.trim(),password:$('#pass').value});
      btn.disabled=false;
      if(r.error){msg.className='msg err'; msg.textContent='فشل الدخول: '+r.error.message; return;}
      msg.className='msg ok'; msg.textContent='تم — جارٍ التحقّق…'; checkAdminAndLoad();
    });
    $('#logout').addEventListener('click',async function(){await sb.auth.signOut(); location.reload();});
    $('#refresh').addEventListener('click',loadOverview);

    async function loadOverview(){
      $('#rows').innerHTML='<tr><td colspan="8" class="center">جارٍ التحميل…</td></tr>';
      try{
        var res=await Promise.all([
          sb.from('exercises').select('id, name, category'),
          sb.from('profiles').select('user_id, username, created_at'),
          sb.from('user_prefs').select('user_id, unit'),
          sb.from('workout_sessions').select('id, user_id, performed_on'),
          sb.from('workout_sets').select('session_id'),
          sb.from('exercises').select('owner_id').not('owner_id','is',null),
          sb.from('food_logs').select('user_id'),
          sb.from('sleep_logs').select('user_id')
        ]);
        for(var i=0;i<res.length;i++){if(res[i].error) throw res[i].error;}
        exMap={}; (res[0].data||[]).forEach(function(e){exMap[e.id]={name:e.name,category:e.category};});
        var profiles=res[1].data||[],prefs=res[2].data||[],sessions=res[3].data||[],
            sets=res[4].data||[],customs=res[5].data||[],foods=res[6].data||[],sleeps=res[7].data||[];
        var U={};
        function ensure(id){if(!id)return null; if(!U[id])U[id]={id:id,username:null,joined:null,sessions:0,sets:0,custom:0,foods:0,sleeps:0,unit:'kg',last:null}; return U[id];}
        profiles.forEach(function(p){var u=ensure(p.user_id); if(u){u.username=p.username; u.joined=p.created_at;}});
        prefs.forEach(function(p){var u=ensure(p.user_id); if(u)u.unit=p.unit||'kg';});
        var sOf={};
        sessions.forEach(function(s){var u=ensure(s.user_id); if(u){u.sessions++; sOf[s.id]=s.user_id; if(!u.last||s.performed_on>u.last)u.last=s.performed_on;}});
        sets.forEach(function(st){var uid=sOf[st.session_id]; if(uid&&U[uid])U[uid].sets++;});
        customs.forEach(function(e){var u=ensure(e.owner_id); if(u)u.custom++;});
        foods.forEach(function(f){var u=ensure(f.user_id); if(u)u.foods++;});
        sleeps.forEach(function(s){var u=ensure(s.user_id); if(u)u.sleeps++;});

        usersById=U;
        var list=Object.keys(U).map(function(k){return U[k];}).sort(function(a,b){return b.sessions-a.sessions;});
        var totS=list.reduce(function(a,u){return a+u.sessions;},0),
            totC=list.reduce(function(a,u){return a+u.custom;},0),
            named=list.filter(function(u){return u.username;}).length;
        $('#stats').innerHTML=tile(list.length,'مستخدم','alt')+tile(totS,'إجمالي الجلسات','')+tile(totC,'تمارين خاصة','')+tile(named+' / '+list.length,'اختاروا اسمًا','');
        $('#foot-count').textContent=list.length+' مستخدم';
        if(!list.length){$('#rows').innerHTML='<tr><td colspan="8" class="center">لا يوجد مستخدمون ببيانات بعد.</td></tr>'; return;}
        $('#rows').innerHTML=list.map(function(u){
          var you=(u.id===meId)?' <span class="pill you">أنت</span>':'';
          return '<tr data-uid="'+esc(u.id)+'">'+
            '<td><span class="uname"><span class="av">'+esc(initial(u))+'</span>'+nameHtml(u)+you+'</span></td>'+
            '<td class="num">'+u.sessions+'</td><td class="num">'+u.sets+'</td>'+
            '<td class="num">'+u.custom+'</td><td class="num">'+u.foods+'</td><td class="num">'+u.sleeps+'</td>'+
            '<td class="num muted">'+(u.last||'—')+'</td><td class="chev">‹</td></tr>';
        }).join('');
        Array.prototype.forEach.call(document.querySelectorAll('#rows tr[data-uid]'),function(tr){
          tr.addEventListener('click',function(){openUser(tr.getAttribute('data-uid'));});
        });
      }catch(e){ $('#rows').innerHTML='<tr><td colspan="8" class="center">تعذّر التحميل: '+esc(e.message||e)+'</td></tr>'; }
    }
    function tile(n,k,cls){return '<div class="tile '+cls+'"><div class="n num">'+n+'</div><div class="k">'+k+'</div></div>';}

    async function openUser(uid){
      var u=usersById[uid]||{id:uid,username:null,unit:'kg'};
      var box=$('#detail'), inner=$('#detail-inner');
      inner.innerHTML='<div class="center">جارٍ تحميل بيانات المستخدم…</div>';
      box.classList.add('show'); window.scrollTo(0,0);
      try{
        var r=await Promise.all([
          sb.from('workout_sessions').select('id, exercise_id, performed_on').eq('user_id',uid),
          sb.from('plan_days').select('day_of_week, name').eq('user_id',uid),
          sb.from('plan_day_exercises').select('day_of_week, exercise_id, position').eq('user_id',uid),
          sb.from('food_logs').select('logged_on, name, calories, protein, carbs, fat').eq('user_id',uid),
          sb.from('sleep_logs').select('slept_on, sleep_time, wake_time, duration_min').eq('user_id',uid),
          sb.from('exercises').select('id, name, category').eq('owner_id',uid)
        ]);
        for(var i=0;i<r.length;i++){if(r[i].error) throw r[i].error;}
        var sessions=r[0].data||[], plans=r[1].data||[], planEx=r[2].data||[], foods=r[3].data||[], sleeps=r[4].data||[], customs=r[5].data||[];
        var sets=[]; var ids=sessions.map(function(s){return s.id;});
        if(ids.length){ var sr=await sb.from('workout_sets').select('session_id, set_index, reps, weight').in('session_id',ids); if(sr.error) throw sr.error; sets=sr.data||[]; }
        renderDetail(u, {sessions:sessions,sets:sets,plans:plans,planEx:planEx,foods:foods,sleeps:sleeps,customs:customs});
      }catch(e){ inner.innerHTML='<div class="d-top"><button class="d-back" id="dback">‹ رجوع</button></div><div class="center">تعذّر التحميل: '+esc(e.message||e)+'</div>'; wireBack(); }
    }
    function wireBack(){ var b=$('#dback'); if(b)b.addEventListener('click',function(){$('#detail').classList.remove('show');}); }

    function renderDetail(u, d){
      // sets by session
      var setsBy={}; d.sets.forEach(function(s){(setsBy[s.session_id]=setsBy[s.session_id]||[]).push(s);});
      // sessions grouped by date desc
      var byDate={}; d.sessions.forEach(function(s){(byDate[s.performed_on]=byDate[s.performed_on]||[]).push(s);});
      var dates=Object.keys(byDate).sort().reverse();
      var logHtml=dates.length? dates.map(function(dt){
        var exs=byDate[dt].map(function(s){
          var st=(setsBy[s.id]||[]).sort(function(a,b){return a.set_index-b.set_index;});
          var setsH=st.length? st.map(function(x){return '<span class="set"><b>'+x.reps+'</b>×'+(+x.weight)+'</span>';}).join('') : '<span class="muted" style="font-size:12px">—</span>';
          return '<div class="ex"><span class="ex-name"><span class="tag" style="background:'+catColor(exCat(s.exercise_id))+'"></span>'+esc(exName(s.exercise_id))+'</span><span class="sets">'+setsH+'</span></div>';
        }).join('');
        return '<div class="daygrp"><div class="daygrp-h"><span class="daygrp-date">'+esc(dt)+'</span><span class="daygrp-meta">'+byDate[dt].length+' تمرين</span></div>'+exs+'</div>';
      }).join('') : '<div class="empty-mini">لا جلسات مسجّلة.</div>';

      // plan
      var DOW=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
      var exByDay={}; d.planEx.forEach(function(p){(exByDay[p.day_of_week]=exByDay[p.day_of_week]||[]).push(p);});
      var planHtml=d.plans.length? d.plans.sort(function(a,b){return a.day_of_week-b.day_of_week;}).map(function(pd){
        var exs=(exByDay[pd.day_of_week]||[]).sort(function(a,b){return a.position-b.position;});
        var li=exs.length? exs.map(function(pe){return '<li><span class="dot" style="background:'+catColor(exCat(pe.exercise_id))+'"></span>'+esc(exName(pe.exercise_id))+'</li>';}).join('') : '<li class="muted">—</li>';
        return '<div class="day"><div class="day-name">'+esc(pd.name||DOW[pd.day_of_week])+' · '+DOW[pd.day_of_week]+'</div><ul>'+li+'</ul></div>';
      }).join('') : '<div class="empty-mini">لا خطة أسبوعية.</div>';

      // customs
      var custHtml=d.customs.length? '<div class="chips">'+d.customs.map(function(e){return '<span class="chip"><span class="tag" style="background:'+catColor(e.category)+'"></span>'+esc(e.name)+'</span>';}).join('')+'</div>' : '<div class="empty-mini">لا تمارين خاصة.</div>';

      // food
      var foodHtml=d.foods.length? '<div class="rows2">'+d.foods.slice().sort(function(a,b){return (b.logged_on||'').localeCompare(a.logged_on||'');}).map(function(f){
        return '<div class="row2"><span class="r-name">'+esc(f.name)+'</span><span class="r-val num">'+Math.round(+f.calories)+' سعرة</span><span class="r-meta num">'+esc(f.logged_on)+'</span></div>';
      }).join('')+'</div>' : '<div class="empty-mini">لا وجبات مسجّلة.</div>';

      // sleep
      var sleepHtml=d.sleeps.length? '<div class="rows2">'+d.sleeps.slice().sort(function(a,b){return (b.slept_on||'').localeCompare(a.slept_on||'');}).map(function(s){
        var h=Math.floor((s.duration_min||0)/60), m=(s.duration_min||0)%60;
        return '<div class="row2"><span class="r-name num" style="direction:ltr">'+(s.sleep_time||'—')+' → '+(s.wake_time||'—')+'</span><span class="r-val num">'+h+'س '+m+'د</span><span class="r-meta num">'+esc(s.slept_on)+'</span></div>';
      }).join('')+'</div>' : '<div class="empty-mini">لا نوم مسجّل.</div>';

      var totSets=d.sets.length, totVol=Math.round(d.sets.reduce(function(a,x){return a+(x.reps*(+x.weight||0));},0));
      $('#detail-inner').innerHTML=
        '<div class="d-top"><button class="d-back" id="dback">‹ رجوع للقائمة</button><span class="d-id">'+esc(u.id)+'</span></div>'+
        '<div class="d-title"><span class="av">'+esc(initial(u))+'</span><span class="name">'+nameHtml(u)+'</span></div>'+
        '<div class="stats">'+tile(d.sessions.length,'جلسة','alt')+tile(totSets,'مجموعة','')+tile(totVol.toLocaleString('en-US'),'حِمل ('+(u.unit||'kg').toUpperCase()+')','')+tile(d.customs.length,'تمرين خاص','')+'</div>'+
        sec('الخطة الأسبوعية','<div class="plan">'+planHtml+'</div>')+
        sec('سجلّ التمارين','<div class="log">'+logHtml+'</div>')+
        sec('التمارين الخاصة',custHtml)+
        sec('التغذية',foodHtml)+
        sec('النوم',sleepHtml);
      wireBack();
    }
    function sec(title,body){return '<div class="dsec"><div class="sec-head"><h3>'+title+'</h3><span class="rule"></span></div>'+body+'</div>';}

    (async function(){ var s=await sb.auth.getSession(); if(s&&s.data&&s.data.session) checkAdminAndLoad(); else showLogin(); })();
  })();
  </script>
</body>
</html>
