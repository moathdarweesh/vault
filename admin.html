<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THE VAULT — لوحة الإدارة</title>
<style>
  :root{
    --bg:#08080a; --surface:#141418; --surface-2:#1b1b21; --line:#26262e;
    --accent:#5b8def; --accent-soft:rgba(91,141,239,.14); --accent-ink:#04122e;
    --text:#f4f4f7; --dim:#9a9aa6; --mute:#6b6b76; --good:#4fd1a5; --warn:#f0b45b; --red:#ef6f6f;
    --radius:18px; --radius-sm:12px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:
    radial-gradient(1000px 560px at 100% -10%, rgba(91,141,239,.10), transparent 60%), var(--bg);
    color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.55; min-height:100vh}
  .num{font-variant-numeric:tabular-nums; unicode-bidi:plaintext}
  button{font-family:inherit; cursor:pointer}
  .hidden{display:none !important}

  /* ---- login ---- */
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:30px; width:100%; max-width:390px}
  .brand{display:flex; align-items:center; gap:10px; font-weight:900; letter-spacing:-.01em; font-size:20px; margin-bottom:4px}
  .brand .v{display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border-radius:10px; background:var(--accent); color:var(--accent-ink); font-size:18px}
  .card h1{font-size:19px; font-weight:800; margin:14px 0 4px}
  .card p.sub{color:var(--dim); font-size:14px; margin:0 0 20px}
  label{display:block; font-size:12.5px; font-weight:700; color:var(--dim); margin:0 0 6px}
  input{width:100%; padding:12px 14px; background:var(--surface-2); border:1px solid var(--line);
    border-radius:11px; color:var(--text); font-size:15px; outline:none; margin-bottom:14px; transition:border-color .15s}
  input:focus{border-color:var(--accent)}
  .btn{width:100%; padding:13px; border:none; border-radius:12px; background:var(--accent); color:var(--accent-ink);
    font-size:15px; font-weight:800; transition:filter .15s, transform .12s}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.55; cursor:default}
  .msg{font-size:13px; margin-top:12px; min-height:18px; text-align:center}
  .msg.err{color:var(--red)} .msg.ok{color:var(--good)}

  /* ---- dashboard ---- */
  .wrap{max-width:1100px; margin:0 auto; padding:clamp(18px,4vw,40px) clamp(14px,3.5vw,28px) 70px}
  .top{display:flex; align-items:center; gap:14px; margin-bottom:8px; flex-wrap:wrap}
  .top .brand{margin:0}
  .top .who{color:var(--dim); font-size:13px; margin-inline-start:auto}
  .top .out{background:transparent; border:1px solid var(--line); color:var(--dim); border-radius:10px; padding:8px 14px; font-size:13px; font-weight:700}
  .top .out:hover{color:var(--text); border-color:var(--dim)}
  .eyebrow{color:var(--accent); font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; margin:16px 0 4px}
  h2.title{font-size:clamp(24px,4.5vw,34px); font-weight:900; letter-spacing:-.02em; margin:0 0 22px}

  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:30px}
  .tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px}
  .tile .n{font-size:clamp(24px,4vw,34px); font-weight:900; letter-spacing:-.02em; line-height:1}
  .tile .k{color:var(--dim); font-size:12.5px; margin-top:7px; font-weight:600}
  .tile.alt .n{color:var(--accent)}

  .sec-head{display:flex; align-items:baseline; gap:12px; margin:0 0 14px}
  .sec-head h3{font-size:17px; font-weight:800; margin:0}
  .sec-head .rule{flex:1; height:1px; background:var(--line)}
  .sec-head .refresh{background:transparent; border:1px solid var(--line); color:var(--dim); border-radius:9px; padding:6px 12px; font-size:12px; font-weight:700}

  .table-wrap{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
  .tbl{width:100%; border-collapse:collapse; min-width:640px}
  .tbl th{text-align:start; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase;
    color:var(--mute); padding:13px 16px; background:var(--surface-2); border-bottom:1px solid var(--line); white-space:nowrap}
  .tbl td{padding:13px 16px; border-bottom:1px solid #1e1e25; font-size:14px}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tr:hover td{background:rgba(91,141,239,.05)}
  .uname{font-weight:800; display:flex; align-items:center; gap:9px}
  .uname .av{width:30px; height:30px; border-radius:9px; background:var(--accent-soft); color:var(--accent);
    display:inline-flex; align-items:center; justify-content:center; font-weight:900; font-size:13px; flex-shrink:0}
  .handle{color:var(--accent)}
  .noname{color:var(--mute); font-weight:600; font-style:normal}
  .pill{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11.5px; font-weight:800; background:var(--surface-2); border:1px solid var(--line)}
  .pill.you{background:var(--accent-soft); border-color:transparent; color:var(--accent)}
  .scroll-x{overflow-x:auto}
  .muted{color:var(--mute)}
  .center{text-align:center; color:var(--dim); padding:40px 16px; font-size:14px}
  footer{margin-top:30px; color:var(--mute); font-size:12.5px; display:flex; gap:8px 14px; flex-wrap:wrap; align-items:center}
  .badge{display:inline-flex; align-items:center; gap:7px; color:var(--good); font-weight:700}
  .badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good)}

  @media (max-width:720px){ .stats{grid-template-columns:repeat(2,1fr)} }
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>

  <!-- LOGIN -->
  <div id="login" class="login-wrap">
    <form class="card" id="login-form" autocomplete="on">
      <div class="brand"><span class="v">🏋️</span> THE VAULT</div>
      <h1>لوحة الإدارة</h1>
      <p class="sub">سجّل دخولك بحساب المالك لعرض بيانات كل المستخدمين.</p>
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" placeholder="بريدك" autocomplete="username" required>
      <label for="pass">كلمة السر</label>
      <input id="pass" type="password" placeholder="كلمة السر" autocomplete="current-password" required>
      <button class="btn" id="login-btn" type="submit">تسجيل الدخول</button>
      <div class="msg" id="login-msg"></div>
    </form>
  </div>

  <!-- DASHBOARD -->
  <div id="dash" class="wrap hidden">
    <div class="top">
      <div class="brand"><span class="v">🏋️</span> THE VAULT</div>
      <span class="who" id="who"></span>
      <button class="out" id="logout">خروج</button>
    </div>
    <div class="eyebrow">لوحة الإدارة</div>
    <h2 class="title">كل المستخدمين وبياناتهم</h2>

    <div class="stats" id="stats"></div>

    <div class="sec-head">
      <h3>المستخدمون</h3>
      <span class="rule"></span>
      <button class="refresh" id="refresh">تحديث</button>
    </div>
    <div class="table-wrap">
      <div class="scroll-x">
        <table class="tbl">
          <thead>
            <tr>
              <th>المستخدم</th>
              <th>الجلسات</th>
              <th>المجموعات</th>
              <th>تمارين خاصة</th>
              <th>وجبات</th>
              <th>نوم</th>
              <th>آخر نشاط</th>
              <th>الوحدة</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="8" class="center">جارٍ التحميل…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <footer>
      <span class="badge">مباشر من قاعدة البيانات</span>
      <span>·</span><span>محميّ بصلاحية الأدمِن (RLS)</span>
      <span>·</span><span id="foot-count"></span>
    </footer>
  </div>

  <script src="js/vendor/supabase.js"></script>
  <script>
  (function(){
    'use strict';
    var SUPABASE_URL = 'https://ilmusnuchqlpirywonzx.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_ZBR2VENMP2O_K2YTMePCsw_NfLC9FSI';
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth:{persistSession:true, autoRefreshToken:true}
    });

    var $ = function(s){ return document.querySelector(s); };
    var loginBox = $('#login'), dashBox = $('#dash');

    function showLogin(){ loginBox.classList.remove('hidden'); dashBox.classList.add('hidden'); }
    function showDash(){ loginBox.classList.add('hidden'); dashBox.classList.remove('hidden'); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function shortId(id){ return String(id||'').slice(0,8); }

    // ---- auth flow ----
    async function checkAdminAndLoad(){
      var msg = $('#login-msg');
      try{
        var r = await sb.rpc('is_admin');
        if(r.error) throw r.error;
        if(r.data === true){
          var s = await sb.auth.getSession();
          var email = s && s.data && s.data.session && s.data.session.user ? s.data.session.user.email : '';
          $('#who').textContent = email ? ('مسجّل: ' + email) : '';
          showDash();
          loadData();
        } else {
          await sb.auth.signOut();
          msg.className = 'msg err';
          msg.textContent = 'هذا الحساب ليس أدمِن. لوحة الإدارة للمالك فقط.';
          showLogin();
        }
      }catch(e){
        msg.className='msg err'; msg.textContent = 'تعذّر التحقّق: ' + (e.message||e); showLogin();
      }
    }

    $('#login-form').addEventListener('submit', async function(e){
      e.preventDefault();
      var btn=$('#login-btn'), msg=$('#login-msg');
      btn.disabled=true; msg.className='msg'; msg.textContent='جارٍ تسجيل الدخول…';
      var r = await sb.auth.signInWithPassword({ email:$('#email').value.trim(), password:$('#pass').value });
      btn.disabled=false;
      if(r.error){ msg.className='msg err'; msg.textContent = 'فشل الدخول: ' + r.error.message; return; }
      msg.className='msg ok'; msg.textContent='تم — جارٍ التحقّق من الصلاحية…';
      checkAdminAndLoad();
    });

    $('#logout').addEventListener('click', async function(){ await sb.auth.signOut(); location.reload(); });
    $('#refresh').addEventListener('click', loadData);

    // ---- data ----
    async function loadData(){
      $('#rows').innerHTML = '<tr><td colspan="8" class="center">جارٍ التحميل…</td></tr>';
      try{
        var res = await Promise.all([
          sb.from('profiles').select('user_id, username, created_at'),
          sb.from('user_prefs').select('user_id, unit'),
          sb.from('workout_sessions').select('id, user_id, performed_on'),
          sb.from('workout_sets').select('session_id'),
          sb.from('exercises').select('owner_id').not('owner_id','is',null),
          sb.from('food_logs').select('user_id'),
          sb.from('sleep_logs').select('user_id')
        ]);
        for(var i=0;i<res.length;i++){ if(res[i].error) throw res[i].error; }
        var profiles=res[0].data||[], prefs=res[1].data||[], sessions=res[2].data||[],
            sets=res[3].data||[], customs=res[4].data||[], foods=res[5].data||[], sleeps=res[6].data||[];

        var U = {};
        function ensure(id){ if(!id) return null; if(!U[id]) U[id]={id:id, username:null, joined:null,
          sessions:0, sets:0, custom:0, foods:0, sleeps:0, unit:'kg', last:null}; return U[id]; }

        profiles.forEach(function(p){ var u=ensure(p.user_id); if(u){ u.username=p.username; u.joined=p.created_at; } });
        prefs.forEach(function(p){ var u=ensure(p.user_id); if(u) u.unit=p.unit||'kg'; });
        var sessOfId={};
        sessions.forEach(function(s){ var u=ensure(s.user_id); if(u){ u.sessions++; sessOfId[s.id]=s.user_id;
          if(!u.last || s.performed_on>u.last) u.last=s.performed_on; } });
        sets.forEach(function(st){ var uid=sessOfId[st.session_id]; if(uid&&U[uid]) U[uid].sets++; });
        customs.forEach(function(e){ var u=ensure(e.owner_id); if(u) u.custom++; });
        foods.forEach(function(f){ var u=ensure(f.user_id); if(u) u.foods++; });
        sleeps.forEach(function(s){ var u=ensure(s.user_id); if(u) u.sleeps++; });

        var list = Object.keys(U).map(function(k){ return U[k]; })
          .sort(function(a,b){ return (b.sessions)-(a.sessions); });

        // stats
        var totUsers=list.length,
            totSessions=list.reduce(function(a,u){return a+u.sessions;},0),
            totCustom=list.reduce(function(a,u){return a+u.custom;},0),
            named=list.filter(function(u){return u.username;}).length;
        $('#stats').innerHTML =
          tile(totUsers,'مستخدم','alt') + tile(totSessions,'إجمالي الجلسات','') +
          tile(totCustom,'تمارين خاصة','') + tile(named+' / '+totUsers,'اختاروا اسمًا','');
        $('#foot-count').textContent = totUsers + ' مستخدم';

        // current user id (to badge "you")
        var meRes = await sb.auth.getUser();
        var meId = meRes && meRes.data && meRes.data.user ? meRes.data.user.id : null;

        if(!list.length){ $('#rows').innerHTML='<tr><td colspan="8" class="center">لا يوجد مستخدمون ببيانات بعد.</td></tr>'; return; }
        $('#rows').innerHTML = list.map(function(u){
          var name = u.username
            ? '<span class="handle">@'+esc(u.username)+'</span>'
            : '<span class="noname">'+esc(shortId(u.id))+'…</span>';
          var initial = u.username ? u.username[0].toUpperCase() : '؟';
          var you = (u.id===meId) ? ' <span class="pill you">أنت</span>' : '';
          return '<tr>'+
            '<td><span class="uname"><span class="av">'+esc(initial)+'</span>'+name+you+'</span></td>'+
            '<td class="num">'+u.sessions+'</td>'+
            '<td class="num">'+u.sets+'</td>'+
            '<td class="num">'+u.custom+'</td>'+
            '<td class="num">'+u.foods+'</td>'+
            '<td class="num">'+u.sleeps+'</td>'+
            '<td class="num muted">'+(u.last||'—')+'</td>'+
            '<td><span class="pill">'+esc((u.unit||'kg').toUpperCase())+'</span></td>'+
          '</tr>';
        }).join('');
      }catch(e){
        $('#rows').innerHTML = '<tr><td colspan="8" class="center">تعذّر تحميل البيانات: '+esc(e.message||e)+'</td></tr>';
      }
    }
    function tile(n,k,cls){ return '<div class="tile '+cls+'"><div class="n num">'+n+'</div><div class="k">'+k+'</div></div>'; }

    // ---- boot: resume an existing session ----
    (async function(){
      var s = await sb.auth.getSession();
      if(s && s.data && s.data.session){ checkAdminAndLoad(); } else { showLogin(); }
    })();
  })();
  </script>
</body>
</html>
