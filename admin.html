<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VAULT — لوحة التحكّم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    /* THE CONSOLE'S OWN SYSTEM, from Vault Admin.dc.html.
       It shares the app's orange but sets it on a COLD neutral scale on
       purpose: this is instrumentation, not the product. (v284 had matched the
       app's warm browns; the design overrules that.)

       The muscle colours stay identical to the app's --cat-* values, and THAT
       part is not taste: before v284 --legs was amber here and GREEN in the
       app, --arms teal here and AMBER in the app, so the same dot named a
       different muscle depending on which screen the owner was looking at. */
    --bg:#08090a; --surface:#0e0f11; --surface-2:#131416; --surface-3:#1d1f22;
    --line:#1c1e21; --line-2:#1a1c1f; --line-3:#17181b; --edge:#26282c; --edge-hi:#3d4045;
    --accent:#ff6a00; --accent-soft:rgba(255,106,0,.1); --accent-edge:#3a2a14; --accent-ink:#1a0800;
    /* --mute is small text (labels, table headers, timestamps): 5.0:1 on the
       darkest panel. It was #6e7176 = 3.4:1 there, under AA. --faint is for
       icon tints and rules only — never text. */
    --text:#e8e8ea; --dim:#9a9ea3; --mute:#8b8f95; --faint:#4d5055;
    --good:#34d399; --warn:#e0b23c; --red:#f87171;
    --chest:#f472b6; --back:#60a5fa; --legs:#34d399; --shoulders:#c084fc; --arms:#fbbf24; --core:#fb7185; --other:#9a9ea3;
    --radius:14px; --radius-sm:9px;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --display:Archivo,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:
    var(--bg);
    color:var(--text); font-family:'IBM Plex Sans Arabic',system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.55; min-height:100vh}
  /* The design sets every figure in JetBrains Mono. Tabular by construction —
     it is what makes a column of percentages scan as a column. */
  /* ===================================================================== */
  /* CONSOLE COMPONENTS — geometry and colour taken from Vault Admin.dc.html */
  /* ===================================================================== */
  .mgrid{display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-bottom:22px}
  .mcard{background:var(--surface); border:1px solid var(--line); border-radius:13px;
    padding:18px 20px; display:flex; flex-direction:column; gap:11px; min-width:0}
  .mlabel{font-size:12.5px; color:var(--mute)}
  /* Archivo 30/700 is the design's hero figure — the one place a display face
     is used, so the five headline numbers read as one row of instruments. */
  .mvalue{font-family:var(--display); font-weight:700; font-size:30px; line-height:1; color:var(--text); text-align:start}
  .mdelta{font-size:11.5px}

  .ogrid{display:grid; grid-template-columns:1.35fr 1fr; gap:18px; align-items:start}
  .ocol{display:flex; flex-direction:column; gap:18px; min-width:0}
  .panel2{background:var(--surface); border:1px solid var(--line); border-radius:14px;
    display:flex; flex-direction:column; min-width:0; overflow:hidden}
  .panel2.accent{border-color:#2a2114; padding:20px 22px; gap:16px}
  .p2head{display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:18px 22px; border-bottom:1px solid var(--line-2); flex-wrap:wrap}
  .p2head2{display:flex; align-items:center; justify-content:space-between; gap:12px}
  .panel2:not(.accent) .p2head2{padding:17px 22px; border-bottom:1px solid var(--line-2)}
  .p2title{display:flex; align-items:center; gap:10px; font-size:15px; font-weight:600; color:var(--text)}
  .p2sub{font-size:12.5px; color:var(--mute)}
  .p2week{font-size:11px; color:var(--mute)}
  .p2link{font-size:12.5px; color:var(--accent); cursor:pointer}
  .p2foot{padding:13px 22px; font-size:12.5px; line-height:1.7; color:var(--dim)}
  .p2note{border-top:1px solid var(--line); padding-top:13px; font-size:12.5px; line-height:1.7; color:var(--mute)}
  .wdot{width:7px; height:7px; border-radius:50%; background:var(--warn); flex:none}

  .srow{display:flex; align-items:center; gap:14px; padding:14px 22px;
    border-bottom:1px solid var(--line-3); cursor:pointer}
  .srow:hover{background:#121315}
  .smain{flex:1; display:flex; flex-direction:column; gap:3px; min-width:0}
  .sname{font-size:14px; font-weight:500}
  .snote{font-size:12px; color:var(--mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .sbarwrap{width:96px; height:5px; border-radius:3px; background:var(--surface-3); overflow:hidden; flex:none}
  .sbar{display:block; height:100%; border-radius:3px; background:var(--warn)}
  .spct{font-size:13px; color:var(--warn); min-width:38px; text-align:end; flex:none}

  /* Users screen — the design's five columns. Grid, not <table>: the adherence
     cell holds a bar plus a figure, which a table cell aligns badly. */
  .uhead,.urow{display:grid; grid-template-columns:1.5fr 1fr 1.2fr 1.1fr 96px;
    gap:16px; align-items:center}
  .uhead{padding:12px 22px; border-bottom:1px solid var(--line-2);
    font-size:11.5px; color:var(--mute)}
  .urow{padding:14px 22px; border-bottom:1px solid var(--line-3); cursor:pointer}
  .urow:hover{background:#121315}
  .ucell{min-width:0}
  .uname-cell{display:flex; align-items:center; gap:12px}
  .ustack{display:flex; flex-direction:column; gap:3px; min-width:0}
  .uname2{font-size:14px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .ustatus{font-size:11.5px}
  .ustatus.behind{color:var(--warn)}
  .ustatus.steady{color:#55585d}
  .ustatus.none{color:var(--mute)}
  .useen{font-size:13px; color:var(--dim)}
  .ubarcell{display:flex; align-items:center; gap:11px}
  .ubarwrap{flex:1; max-width:110px; height:5px; border-radius:3px;
    background:var(--surface-3); overflow:hidden}
  .ubar{display:block; height:100%; border-radius:3px; background:var(--dim)}
  .ubar.behind{background:var(--warn)}
  .upct{font-size:13px; color:var(--dim); min-width:38px}
  .upct.behind{color:var(--warn)}
  .upct.none{color:var(--mute)}
  .uplan{font-size:13px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .urole{font-size:12px; color:var(--mute); text-align:center}
  @media(max-width:860px){
    .uhead{display:none}
    .urow{grid-template-columns:1fr; row-gap:8px}
    .ubarcell{max-width:none}
  }
  /* الخطة مقابل التنفيذ — two overlaid bars per weekday. The plan sits behind
     in a neutral track; what was actually done is painted in front, so a short
     week reads as a gap rather than as a number you have to compare. */
  .pvd{display:grid; grid-template-columns:60px 1fr 86px; gap:14px; align-items:center;
    padding:13px 22px; border-bottom:1px solid var(--line-3)}
  .pvd-day{font-size:13px; color:var(--dim)}
  .pvd-track{position:relative; height:22px; display:flex; align-items:center}
  .pvd-plan,.pvd-done{position:absolute; inset-inline-start:0; height:8px; border-radius:4px}
  .pvd-plan{width:44%; background:#2b2d31}
  .pvd-done{width:44%; background:var(--text)}
  .pvd-label{font-size:12.5px; text-align:end}
  .pvd-label.rest{color:var(--mute)}
  .pvd-label.met{color:var(--dim)}
  .pvd-label.short{color:var(--warn)}
  /* A day still ahead of us is not a miss — grey, never amber. */
  .pvd-label.ahead{color:var(--mute)}
  .pvd-legend{display:flex; align-items:center; gap:15px; font-size:12px; color:var(--mute)}
  .pvd-legend span{display:flex; align-items:center; gap:7px}
  .pvd-legend i{width:14px; height:6px; border-radius:3px; display:block}
  .pvd-legend .k-plan{background:#2b2d31}
  .pvd-legend .k-done{background:var(--text)}
  .snaps{display:flex; flex-direction:column; gap:12px}
  .snap{display:flex; align-items:center; gap:12px}
  .slab{flex:1; font-size:13.5px; color:var(--dim)}
  .sval{font-size:15px; color:var(--text)}

  .erow-brief{display:flex; align-items:center; gap:12px; padding:13px 22px; border-bottom:1px solid var(--line-3)}
  .emsg{flex:1; font-size:13px; color:#c6c8cc; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .etime{font-size:11.5px; color:var(--mute); flex:none}
  /* Severity is a DERIVED signal (see renderErrors) — a dot, never a word that
     would imply the app classified it. */
  .edot{width:8px; height:8px; border-radius:50%; flex:none; background:#3a3d42}
  .edot.high{background:var(--red)} .edot.mid{background:var(--warn)}

  .p2bar{display:flex; align-items:center; gap:8px; padding:15px 22px;
    border-bottom:1px solid var(--line-2); flex-wrap:wrap}
  .p2count{margin-inline-start:auto; font-size:12.5px; color:var(--mute)}
  .fpill{border:1px solid var(--edge); border-radius:8px; padding:7px 13px; font-size:12.5px;
    font-weight:500; color:var(--dim); cursor:pointer; user-select:none}
  .fpill:hover{border-color:var(--edge-hi)}
  .fpill.on{border-color:var(--accent-edge); background:var(--accent-soft); color:var(--accent)}
  .ehead,.erow{display:grid; grid-template-columns:8px 1fr 150px 92px; gap:16px; align-items:center}
  .ehead{padding:12px 22px; border-bottom:1px solid var(--line-2); font-size:11.5px; color:var(--mute)}
  .erow{padding:15px 22px; border-bottom:1px solid var(--line-3)}
  .ebody{display:flex; flex-direction:column; gap:4px; min-width:0}
  .emsg2{font-size:13.5px; color:var(--text)}
  .ewhere{font-size:11.5px; color:var(--mute); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .ewho{font-size:12.5px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .ewhen{font-size:11.5px; color:var(--mute); text-align:end}

  /* Below the design's 1440px frame the five-across metric row and the two
     asymmetric columns stop being readable — they stack rather than shrink. */
  @media(max-width:1100px){
    .mgrid{grid-template-columns:repeat(2,1fr)}
    .ogrid{grid-template-columns:1fr}
  }
  @media(max-width:760px){
    .mgrid{grid-template-columns:1fr}
    .ehead{display:none}
    .erow{grid-template-columns:8px 1fr; row-gap:6px}
    .ewho,.ewhen{grid-column:2; text-align:start}
  }
  .num{font-family:var(--mono); font-variant-numeric:tabular-nums; unicode-bidi:plaintext}
  button{font-family:inherit; cursor:pointer}
  .hidden{display:none !important}
  select{font-family:inherit}

  /* login */
  .login-wrap{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:30px; width:100%; max-width:390px}
  .brand{display:flex; align-items:center; gap:10px; font-weight:900; letter-spacing:-.01em; font-size:20px}
  /* The mark is the mark — not an emoji in an accent tile. Orange plates on
     the page ground, exactly as the app draws them. */
  .brand .v{display:inline-flex; align-items:center; gap:5px; color:var(--accent)}
  .brand .v svg{display:block}
  .card h1{font-size:19px; font-weight:800; margin:14px 0 4px}
  .card p.sub{color:var(--dim); font-size:14px; margin:0 0 20px}
  label{display:block; font-size:12.5px; font-weight:700; color:var(--dim); margin:0 0 6px}
  input,textarea,select.big{width:100%; padding:12px 14px; background:var(--surface-2); border:1px solid var(--line); border-radius:11px; color:var(--text); font-size:15px; outline:none; margin-bottom:14px; transition:border-color .15s}
  input:focus,textarea:focus{border-color:var(--accent)}
  .btn{width:100%; padding:13px; border:none; border-radius:12px; background:var(--accent); color:var(--accent-ink); font-size:15px; font-weight:800; transition:filter .15s, transform .12s}
  .btn:active{transform:scale(.98)} .btn:disabled{opacity:.55; cursor:default}
  .msg{font-size:13px; margin-top:12px; min-height:18px; text-align:center}
  .msg.err{color:var(--red)} .msg.ok{color:var(--good)}
  .link{display:block; width:100%; margin-top:12px; padding:6px; background:none; border:none; color:var(--accent); font-size:13.5px; font-weight:700; text-align:center}
  .link:hover{text-decoration:underline}

  /* shell */
  .shell{display:flex; min-height:100vh}
  .sidebar{width:236px; flex-shrink:0; background:var(--surface); border-inline-end:1px solid var(--line);
    padding:20px 14px; display:flex; flex-direction:column; gap:4px; position:sticky; top:0; height:100vh}
  /* The design stacks a wordmark over a spaced-out CONSOLE label, so the
     sidebar names the SURFACE, not just the product. */
  .side-brand{display:flex; align-items:center; gap:11px; padding:0 6px 8px}
  .side-brand .bt{display:flex; flex-direction:column; gap:2px}
  .side-brand .bn{font-family:var(--display); font-weight:800; font-size:13px; letter-spacing:.18em; line-height:1; color:var(--text)}
  .side-brand .bs{font-family:var(--mono); font-size:7.5px; letter-spacing:.28em; line-height:1; color:var(--mute)}
  .side-brand .v{display:inline-flex; align-items:center; gap:4px; color:var(--accent)}
  .side-brand .v svg{display:block}
  .nav{display:flex; flex-direction:column; gap:3px}
  .nav-item{display:flex; align-items:center; gap:11px; padding:10px 12px; border-radius:9px; background:none; border:none;
    color:var(--dim); font-size:14.5px; font-weight:700; width:100%; text-align:start; transition:background .15s,color .15s}
  /* Icons are the app's own duotone set now, not emoji: a 19px well with the
     glyph inheriting colour, so the active state tints icon AND label together. */
  .nav-item .ic{width:19px; height:19px; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--faint)}
  .nav-item .ic svg{display:block; --icon-accent:var(--faint)}
  .nav-item:hover .ic{color:var(--dim)}
  .nav-item.active .ic{color:#c6c8cc}
  .nav-item.active .ic svg{--icon-accent:var(--accent)}
  .nav-item:hover{color:var(--text); background:var(--surface-2)}
  .nav-item.active{color:var(--text); background:var(--accent-soft)}
  .nav-item .badge-n{margin-inline-start:auto; font-family:var(--mono); font-size:11px; color:var(--mute)}
  .nav-item.active .badge-n{color:var(--accent)}
  .side-foot{margin-top:auto; padding-top:14px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:9px}
  .side-foot .who2{font-size:11.5px; color:var(--mute); word-break:break-all; padding:0 4px}
  .out{background:transparent; border:1px solid var(--line); color:var(--dim); border-radius:10px; padding:9px 12px; font-size:13px; font-weight:700}
  .out:hover{color:var(--text); border-color:var(--dim)}

  .main{flex:1; min-width:0; padding:clamp(20px,3.4vw,38px) clamp(15px,3.4vw,40px) 70px}
  .main-head{display:flex; align-items:flex-end; gap:14px; flex-wrap:wrap; margin-bottom:22px}
  .main-head .eyebrow{color:var(--accent); font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; margin:0 0 3px}
  .main-head h2{font-size:clamp(23px,4vw,32px); font-weight:900; letter-spacing:-.02em; margin:0}
  .main-head .sub{color:var(--dim); font-size:13.5px; margin-top:4px}
  .head-actions{margin-inline-start:auto; display:flex; gap:8px; align-items:center}
  .abtn{background:var(--surface); border:1px solid var(--line); color:var(--dim); border-radius:10px; padding:9px 13px; font-size:13px; font-weight:700}
  .abtn:hover{color:var(--text); border-color:var(--dim)}
  .abtn.pri{background:var(--accent); color:var(--accent-ink); border-color:transparent}

  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:26px}
  .tile{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px}
  .tile .n{font-size:clamp(22px,3.6vw,32px); font-weight:900; letter-spacing:-.02em; line-height:1}
  .tile .k{color:var(--dim); font-size:12.5px; margin-top:7px; font-weight:600}
  .tile.alt .n{color:var(--accent)}

  .sec-head{display:flex; align-items:baseline; gap:12px; margin:0 0 14px}
  .sec-head h3{font-size:16px; font-weight:800; margin:0}
  .sec-head .rule{flex:1; height:1px; background:var(--line)}

  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px}
  .panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px}
  .panel h4{margin:0 0 14px; font-size:14px; font-weight:800}

  .table-wrap{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
  .scroll-x{overflow-x:auto}
  .tbl{width:100%; border-collapse:collapse; min-width:720px}
  .tbl th{text-align:start; font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--mute); padding:12px 15px; background:var(--surface-2); border-bottom:1px solid var(--line); white-space:nowrap; cursor:pointer; user-select:none}
  .tbl th.no-sort{cursor:default}
  .tbl td{padding:11px 15px; border-bottom:1px solid #1e1e25; font-size:14px}
  .tbl tr:last-child td{border-bottom:none}
  .tbl tbody tr{cursor:pointer; transition:background .12s}
  .tbl tbody tr:hover td{background:rgba(255,106,0,.06)}
  .uname{font-weight:800; display:flex; align-items:center; gap:9px}
  .av{width:30px; height:30px; border-radius:9px; background:var(--accent-soft); color:var(--accent); display:inline-flex; align-items:center; justify-content:center; font-weight:900; font-size:13px; flex-shrink:0}
  .handle{color:var(--accent)} .noname{color:var(--mute); font-weight:600}
  .pill{display:inline-block; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:800; background:var(--surface-2); border:1px solid var(--line); white-space:nowrap}
  .pill.you{background:var(--accent-soft); border-color:transparent; color:var(--accent)}
  .pill.role-admin{background:var(--accent-soft); color:var(--accent); border-color:transparent}
  .pill.role-coach{background:rgba(192,132,252,.16); color:var(--shoulders); border-color:transparent}
  .pill.st-active{color:var(--good)} .pill.st-disabled{color:var(--warn)} .pill.st-banned{color:var(--red)}
  .chev{color:var(--mute)}
  .center{text-align:center; color:var(--dim); padding:40px 16px; font-size:14px}
  .muted{color:var(--mute)}
  .searchbar{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap}
  .searchbar input{margin:0; max-width:340px}
  .filterpills{display:flex; gap:6px; flex-wrap:wrap}
  .fp{background:var(--surface); border:1px solid var(--line); color:var(--dim); border-radius:99px; padding:7px 13px; font-size:12.5px; font-weight:700}
  .fp.active{background:var(--accent-soft); color:var(--accent); border-color:transparent}

  /* analytics bars */
  .bars{display:flex; flex-direction:column; gap:9px}
  .bar-row{display:flex; align-items:center; gap:10px; font-size:13px}
  .bar-label{width:132px; flex-shrink:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; align-items:center; gap:7px}
  .bar-label .tag{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .bar-track{flex:1; height:9px; background:var(--surface-2); border-radius:99px; overflow:hidden}
  .bar-fill{height:100%; background:var(--accent); border-radius:99px}
  .bar-val{width:38px; text-align:end; color:var(--dim); flex-shrink:0}

  /* catalog / chips */
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{display:inline-flex; align-items:center; gap:7px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:7px 13px; font-size:13px; font-weight:700}
  .chip .tag{width:8px;height:8px;border-radius:50%}
  .cat-group{margin-bottom:18px}
  .cat-group h4{margin:0 0 10px; font-size:13.5px; font-weight:800; display:flex; align-items:center; gap:8px}
  .cat-group .count{color:var(--mute); font-size:12px; font-weight:700}

  /* feedback inbox */
  .fb-list{display:flex; flex-direction:column; gap:12px}
  .fb-item{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px 17px}
  .fb-item.resolved{opacity:.55}
  .fb-msg{font-size:14.5px; line-height:1.6; white-space:pre-wrap; word-break:break-word}
  .fb-meta{display:flex; align-items:center; gap:10px; margin-top:11px; flex-wrap:wrap; color:var(--mute); font-size:12px}
  .fb-meta .who3{color:var(--accent); font-weight:700}
  .fb-resolve{margin-inline-start:auto; background:var(--surface-2); border:1px solid var(--line); color:var(--dim); border-radius:9px; padding:6px 12px; font-size:12px; font-weight:700}
  .fb-resolve:hover{color:var(--good); border-color:var(--good)}

  /* management (user detail) */

    async function checkAdminAndLoad(){
      var msg=$('#login-msg');
      try{
        var r=await sb.rpc('is_admin');
        if(r.error) throw r.error;
        if(r.data===true){
          var s=await sb.auth.getSession();
          var u=s&&s.data&&s.data.session?s.data.session.user:null;
          meId=u?u.id:null;
          $('#who').textContent=u?u.email:'';
          showApp(); buildNav();
          // Retention is owner-driven because pg_cron is not guaranteed on the
          // project plan. Run once per verified admin login; failure must not
          // make the control console unavailable.
          try{
            var prune=await sb.rpc('admin_prune_client_errors',{p_days:30});
            if(prune.error) console.warn('[admin] client-error prune failed:',prune.error.message||prune.error);
          }catch(pruneErr){ console.warn('[admin] client-error prune failed:',pruneErr); }
          await loadAll(); showCenter(curCenter);
        }else{
          await sb.auth.signOut();
          msg.className='msg err'; msg.textContent='هذا الحساب ليس أدمِن. لوحة التحكّم للمالك فقط.'; showLogin();
        }
      }catch(e){ msg.className='msg err'; msg.textContent='تعذّر التحقّق: '+(e.message||e); showLogin(); }
    }

    function showCenter(id){

      else if(id==='presets') renderPresets(box);
      else if(id==='feedback') renderFeedback(box);
      else if(id==='admins') renderAdmins(box);

    /* ---------------- data load + aggregate -------------------------------- */
    async function loadAll(){
      $('#center').innerHTML='<div class="center">جارٍ التحميل…</div>';
      var res=await Promise.all([
        fetchAll(function(a,b){return sb.from('exercises').select('id,name,category,owner_id,deleted_at').range(a,b);}),
        fetchAll(function(a,b){return sb.from('profiles').select('user_id,username,created_at,last_seen').range(a,b);}),
        // unit lives in the blob now — the user_prefs mirror table was dropped (migration 18)
        fetchAll(function(a,b){return sb.from('vault_data').select('user_id,data->prefs->>unit').range(a,b);}),
        fetchAll(function(a,b){return sb.from('user_flags').select('user_id,role,status,reason').range(a,b);}),
        fetchAll(function(a,b){return sb.from('cardio_types').select('id,label,owner_id,deleted_at').range(a,b);}),
        fetchAll(function(a,b){return sb.from('feedback').select('id,user_id,username,message,context,status,created_at').range(a,b);}),
        fetchAll(function(a,b){return sb.from('food_catalog').select('*').range(a,b);}),
        fetchAll(function(a,b){return sb.from('preset_plans').select('id,name,description,data,position').range(a,b);}),
        fetchAll(function(a,b){return sb.from('app_config').select('default_unit,announcement_ar,announcement_en,announcement_active').range(a,b);}),
        fetchAll(function(a,b){return sb.from('audit_log').select('id,actor,action,target,detail,created_at').order('id',{ascending:false}).range(a,b);}),
        // The heavy per-user activity aggregation runs in Postgres (is_admin RPCs)
        // instead of downloading millions of rows into the browser — see backend/
        // admin-scale-rpc.sql. These return a per-user rollup + a small analytics JSON.
        sb.rpc('admin_user_stats'),
        sb.rpc('admin_activity'),
        // The design's "سجلّ الأخطاء" screen. client_errors already existed and
        // nothing had ever read it — the table the app writes to on every
        // unhandled rejection had no viewer.
        fetchAll(function(a,b){return sb.from('client_errors').select('id,user_id,build,kind,msg,src,line,created_at').order('id',{ascending:false}).range(a,b);})
      ]);
      var d=res.map(function(r){return r.error?[]:(r.data||[]);});
      var exercises=d[0], profiles=d[1], prefs=d[2], flags=d[3], cardioTypes=d[4], feedback=d[5];
      var foodCatalog=d[6], presets=d[7], appConfig=(d[8]&&d[8][0])||null, auditLog=d[9];
      var userStats=d[10]||[], activity=(res[11]&&!res[11].error&&res[11].data)||{};
      var clientErrors=d[12]||[];

      exMap={}; exercises.forEach(function(e){exMap[e.id]={name:e.name,category:e.category,owner_id:e.owner_id};});

      var U={};
      function ensure(id){ if(!id) return null; if(!U[id]) U[id]={id:id,username:null,joined:null,last_seen:null,unit:'kg',
        role:'user',status:'active',reason:null,sessions:0,sets:0,volume:0,custom:0,foods:0,sleeps:0,cardio:0,last:null,
        weekDone:0,trainingDays:0,planName:null,pct:null}; return U[id]; }
      profiles.forEach(function(p){var u=ensure(p.user_id); if(u){u.username=p.username; u.joined=p.created_at; u.last_seen=p.last_seen;}});
      // WHITELIST at the source: this lands in innerHTML on the detail page, and a
      // PostgREST update of one's own row bypasses the app's kg/lb clamp.
      prefs.forEach(function(p){var u=ensure(p.user_id); if(u)u.unit=(p.unit==='lb')?'lb':'kg';});
      flags.forEach(function(f){var u=ensure(f.user_id); if(u){u.role=f.role||'user'; u.status=f.status||'active'; u.reason=f.reason;}});
      // Per-user activity rollup now comes from the DB (admin_user_stats RPC).
      userStats.forEach(function(r){ var u=ensure(r.user_id); if(u){
        u.sessions=+r.sessions||0; u.sets=+r.sets||0; u.volume=+r.volume||0;
        u.foods=+r.foods||0; u.sleeps=+r.sleeps||0; u.cardio=+r.cardio||0;
        u.custom=+r.custom||0; if(r.last_session)u.last=r.last_session;
        // Adherence (migration 19). pct is NULL — not 0 — when the user has no
        // plan: "0% committed" is a judgement about someone who never set a
        // target, and it would drop every planless account into المتعثّرون.
        u.weekDone=+r.week_done||0; u.trainingDays=+r.training_days||0;
        u.planName=r.plan_name||null;
        u.pct = u.trainingDays>0 ? Math.min(100, Math.round(u.weekDone/u.trainingDays*100)) : null;
      }});

      var list=Object.keys(U).map(function(k){return U[k];});
      // Severity is DERIVED, not stored: client_errors has `kind` (error /
      // unhandledrejection) and a message, no level column. A thrown Error is
      // treated as high, a swallowed rejection as medium, anything else low —
      // and the screen says so rather than implying the app classified them.
      clientErrors.forEach(function(e){
        e.sev = e.kind==='error' ? 'high' : (e.kind==='unhandledrejection' ? 'mid' : 'low');
        var u=U[e.user_id];
        e.who = u ? (u.username||shortId(e.user_id)) : '—';
      });
      // analytics
      var now=new Date();
      function withinDays(ds,n){ if(!ds) return false; var t=new Date(ds.length===10?ds+'T00:00:00':ds); return (now-t)/86400000<=n; }
      function lastActive(u){ var a=u.last_seen?new Date(u.last_seen).getTime():0; var b=u.last?new Date(u.last+'T00:00:00').getTime():0; return Math.max(a,b); }
      var active7=list.filter(function(u){return (now-lastActive(u))/86400000<=7 && lastActive(u)>0;}).length;
      var new7=list.filter(function(u){return withinDays(u.joined,7);}).length;
      var sessToday=+activity.sess_today||0;
      var sessWeek=+activity.sess_week||0;
      var everActive=list.filter(function(u){return lastActive(u)>0;});
      var churn=everActive.length? Math.round(everActive.filter(function(u){return (now-lastActive(u))/86400000>30;}).length/everActive.length*100):0;
      // top exercises / category distribution / recent activity — from admin_activity RPC
      var topEx=(activity.top_ex||[]).map(function(t){return {name:t.name,cat:t.cat,n:+t.n||0};});
      var catDist=activity.cat_dist||{};
      var unitSplit={kg:0,lb:0}; list.forEach(function(u){ unitSplit[u.unit==='lb'?'lb':'kg']++; });
      var recent=(activity.recent||[]).map(function(r){ var u=U[r.user_id]||{id:r.user_id}; return {u:u, ex:r.ex, cat:r.cat, date:r.date}; });

      DATA={
        usersById:U, usersList:list, cardioTypes:cardioTypes, clientErrors:clientErrors,
        globalEx:exercises.filter(function(e){return !e.owner_id && !e.deleted_at;}),
        foodCatalog:foodCatalog, appConfig:appConfig, auditLog:auditLog,
        presets:presets.slice().sort(function(a,b){return (a.position-b.position)||(a.name||'').localeCompare(b.name||'');}),
        feedback:feedback.sort(function(a,b){return (b.created_at||'').localeCompare(a.created_at||'');}),
        totals:{ users:list.length,
          sessions:list.reduce(function(a,u){return a+u.sessions;},0),
          sets:list.reduce(function(a,u){return a+u.sets;},0),
          volume:Math.round(list.reduce(function(a,u){return a+u.volume;},0)),
          custom:list.reduce(function(a,u){return a+u.custom;},0),
          foods:list.reduce(function(a,u){return a+u.foods;},0),
          sleeps:list.reduce(function(a,u){return a+u.sleeps;},0),
          cardio:list.reduce(function(a,u){return a+u.cardio;},0),
          named:list.filter(function(u){return u.username;}).length,
          admins:list.filter(function(u){return u.role==='admin';}).length },
        analytics:{ active7:active7, new7:new7, sessToday:sessToday, sessWeek:sessWeek, churn:churn,
          topEx:topEx, catDist:catDist, unitSplit:unitSplit, recent:recent }
      };
      setBadge('feedback', DATA.feedback.filter(function(f){return f.status==='open';}).length);
    }

    /* ---------------- centers ---------------------------------------------- */
    function renderDashboard(box){
      $('#head-actions').innerHTML='';
      headBtn('↻ تحديث','',async function(){await loadAll(); showCenter('dashboard');});
      headBtn('💾 نسخة احتياطية','pri',exportBackup);
      headBtn('⬇️ تصدير مختصر','',exportAll);
      var T=DATA.totals, A=DATA.analytics, L=DATA.usersList;
      // المتعثّرون: under half their own plan. Users with NO plan are excluded
      // (pct===null) — calling someone who never set a target "متعثّر" is a
      // judgement the data does not support.
      var stalled=L.filter(function(u){return u.pct!==null && u.pct<50;})

      var avgPct=planned.length? Math.round(planned.reduce(function(n,u){return n+u.pct;},0)/planned.length) : null;
      var errs=DATA.clientErrors||[];

      var high24=errs24.filter(function(e){return e.sev==='high';}).length;

      function metric(label,value,delta,color){

        metric('متوسط الالتزام', avgPct===null?'—':avgPct+'%', planned.length?'على '+fmt(planned.length)+' خطة':'لا خطط بعد', avgPct!==null&&avgPct<50?'var(--red)':'var(--dim)')+
        metric('إجمالي الجلسات', fmt(T.sessions), fmt(T.sets)+' مجموعة','var(--dim)')+
        metric('أخطاء ٢٤ ساعة', fmt(errs24.length), high24?fmt(high24)+' عالية الخطورة':'لا شيء عالي', high24?'var(--red)':'var(--dim)')+
      '</div>';

      var stalledRows = stalled.length ? stalled.map(function(u){

          '<span class="av">'+esc(initial(u))+'</span>'+

          '<span class="sbarwrap"><span class="sbar" style="width:'+u.pct+'%"></span></span>'+
          '<span class="spct num" dir="ltr">'+u.pct+'%</span></div>';

        ['جلسات هذا الأسبوع', fmt(L.reduce(function(n,u){return n+u.weekDone;},0))],
        ['حسابات لها خطة', fmt(planned.length)],
        ['متوسط الالتزام', avgPct===null?'—':avgPct+'%'],
        ['أخطاء ٢٤ ساعة', fmt(errs24.length)]
      ].map(function(r){
        return '<div class="snap"><span class="slab">'+r[0]+'</span><span class="sval num" dir="ltr">'+r[1]+'</span></div>';
      }).join('');

      var briefRows = errs.slice(0,4).map(function(e){

            stalledRows+

              '<span class="p2week num" dir="ltr">'+esc(weekLabel())+'</span></div>'+

    // Saturday-anchored week label, matching the SQL in migration 19 exactly —
    // if these two ever disagree the page would caption the wrong seven days.
    function weekStartDate(){
      var d=new Date(); d.setHours(0,0,0,0);
      d.setDate(d.getDate()-((d.getDay()+1)%7));
      return d;
    }
    function weekLabel(){
      var a=weekStartDate(), b=new Date(a); b.setDate(a.getDate()+6);
      var M=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
      return ('0'+a.getDate()).slice(-2)+' — '+('0'+b.getDate()).slice(-2)+' '+M[b.getMonth()];
    }
    function timeShort(iso){
      if(!iso) return '';
      var d=new Date(iso); if(isNaN(d)) return '';
      var sameDay=d.toDateString()===new Date().toDateString();
      return sameDay ? ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)
                     : (d.getMonth()+1)+'/'+d.getDate();
    }

    // سجلّ الأخطاء — the design's fifth screen. client_errors has been
    // collecting since v9 and nothing had ever displayed it.
    var errFilter='all';
    function renderErrors(box){
      $('#head-actions').innerHTML='';
      headBtn('↻ تحديث','',async function(){await loadAll(); showCenter('errors');});
      var all=DATA.clientErrors||[];
      var shown=all.filter(function(e){
        return errFilter==='all' ? true : e.sev===errFilter;
      });
      var pills=[['all','الكل',all.length],['high','عالية',all.filter(function(e){return e.sev==='high';}).length],
                 ['mid','متوسطة',all.filter(function(e){return e.sev==='mid';}).length]]
        .map(function(f){
          return '<span class="fpill'+(errFilter===f[0]?' on':'')+'" data-errf="'+f[0]+'">'+f[1]+' <span class="num">'+f[2]+'</span></span>';
        }).join('');

      var rows = shown.length ? shown.map(function(e){
        return '<div class="erow">'+
          '<span class="edot '+e.sev+'"></span>'+
          '<span class="ebody"><span class="emsg2">'+esc(e.msg||'')+'</span>'+
            '<span class="ewhere num" dir="ltr">'+esc((e.src||'—')+(e.line?(' · '+e.line):''))+' · '+esc(e.build||'')+'</span></span>'+
          '<span class="ewho">'+esc(e.who||'—')+'</span>'+
          '<span class="ewhen num" dir="ltr">'+esc(timeShort(e.created_at))+'</span>'+
        '</div>';

    // THE USERS SCREEN, rebuilt to the Console design. The old table sorted by
    // raw totals — lifetime sessions, sets, custom exercises — which answer
    // "who has used the app most", a question that never changes and cannot be
    // acted on. The design asks a different one: WHO IS FALLING BEHIND THIS
    // WEEK. So the columns are the user, when they were last seen, their
    // adherence, the plan they are on, and their role.
    var usersTab='all';
    function renderUsers(box){
      $('#head-actions').innerHTML='';
      headBtn('↻ تحديث','',async function(){await loadAll(); showCenter('users');});
      var all=DATA.usersList.slice();
      var q=usersFilter.trim().toLowerCase();
      var list=q? all.filter(function(u){
        return (u.username||'').toLowerCase().indexOf(q)>=0 || u.id.toLowerCase().indexOf(q)>=0;
      }) : all;
      // pct===null means NO PLAN, and that is not the same as 0%. A planless
      // account belongs in neither منتظم nor متعثّر — judging someone who never
      // set a target is the one thing this screen must not do.
      list=list.filter(function(u){
        if(usersTab==='steady')  return u.pct!==null && u.pct>=50;
        if(usersTab==='behind')  return u.pct!==null && u.pct<50;
        if(usersTab==='admins')  return u.role==='admin'||u.role==='coach';
        return true;
      });
      // Behind first, then by how far behind. The screen exists to surface them.
      list.sort(function(a,b){
        var ap=(a.pct===null?999:a.pct), bp=(b.pct===null?999:b.pct);
        return ap-bp;
      });

      var counts={
        all:all.length,
        steady:all.filter(function(u){return u.pct!==null&&u.pct>=50;}).length,
        behind:all.filter(function(u){return u.pct!==null&&u.pct<50;}).length,
        admins:all.filter(function(u){return u.role==='admin'||u.role==='coach';}).length
      };
      var pills=[['all','الكل'],['steady','منتظم'],['behind','متعثّر'],['admins','مشرف']]
        .map(function(f){
          return '<span class="fpill'+(usersTab===f[0]?' on':'')+'" data-utab="'+f[0]+'">'+
            f[1]+' <span class="num">'+counts[f[0]]+'</span></span>';
        }).join('');

      function seen(u){
        var d=u.last_seen||u.last;
        if(!d) return '—';
        var t=new Date(d); if(isNaN(t)) return String(d).slice(0,10);
        var days=Math.floor((Date.now()-t.getTime())/864e5);
        if(days<=0) return 'اليوم';
        if(days===1) return 'أمس';
        if(days<7) return 'قبل '+days+' أيام';
        return String(d).slice(0,10);
      }
      function roleLabel(u){ return u.role==='admin'?'أدمن':u.role==='coach'?'مدرب':'مستخدم'; }

      var rows=list.length? list.map(function(u){
        var you=(u.id===meId)?' <span class="pill you">أنت</span>':'';
        var behind=(u.pct!==null&&u.pct<50);
        var status=(u.pct===null)?'بلا خطة':(behind?'متعثّر':'منتظم');
        var statusCls=(u.pct===null)?'none':(behind?'behind':'steady');
        // No plan => no bar and an em dash, never a 0% bar. A full-width empty
        // track reads as "measured at zero"; there was nothing to measure.
        var bar=(u.pct===null)
          ? '<span class="upct num none" dir="ltr">—</span>'
          : '<span class="ubarwrap"><span class="ubar'+(behind?' behind':'')+'" style="width:'+u.pct+'%"></span></span>'+
            '<span class="upct num'+(behind?' behind':'')+'" dir="ltr">'+u.pct+'%</span>';
        return '<div class="urow" data-uid="'+esc(u.id)+'">'+
          '<span class="ucell uname-cell"><span class="av">'+esc(initial(u))+'</span>'+
            '<span class="ustack"><span class="uname2">'+nameHtml(u)+you+'</span>'+
            '<span class="ustatus '+statusCls+'">'+status+'</span></span></span>'+
          '<span class="ucell useen">'+esc(seen(u))+'</span>'+
          '<span class="ucell ubarcell">'+bar+'</span>'+
          '<span class="ucell uplan">'+esc(u.planName||'—')+'</span>'+
          '<span class="ucell urole">'+roleLabel(u)+'</span>'+
        '</div>';
      }).join('') : '<div class="empty-mini" style="padding:44px">لا أحد بهذا الفلتر</div>';

      box.innerHTML='<div class="panel2">'+
        '<div class="p2bar">'+pills+'<span class="p2count">'+fmt(list.length)+' من '+fmt(all.length)+'</span></div>'+
        '<div class="searchbar" style="padding:12px 22px 0"><input id="user-search" type="search" placeholder="بحث بالاسم أو المعرّف…" value="'+esc(usersFilter)+'"></div>'+
        '<div class="uhead"><span>المستخدم</span><span>آخر ظهور</span><span>الالتزام هذا الأسبوع</span><span>الخطة المعيّنة</span><span>الدور</span></div>'+
        rows+
        '<div class="p2foot">الالتزام = أيام تدرّبها من أيام خطتها، والأسبوع من السبت. من لا خطة له لا يُحسب في أيّ من الفلترين.</div>'+
      '</div>';

      var si=$('#user-search');
      si.addEventListener('input',function(){
        usersFilter=si.value; var pos=si.selectionStart; renderUsers(box);
        var ns=$('#user-search'); ns.focus(); try{ns.setSelectionRange(pos,pos);}catch(_){}
      });
      Array.prototype.forEach.call(box.querySelectorAll('[data-utab]'),function(el){
        el.addEventListener('click',function(){ usersTab=el.getAttribute('data-utab'); renderUsers(box); });
      });
      Array.prototype.forEach.call(box.querySelectorAll('.urow'),function(r){
        r.addEventListener('click',function(){ openUser(r.getAttribute('data-uid')); });

    // Generic CRUD modal: body html + onSave(overlay, close).
    function admModal(title, bodyHtml, onSave){
      var ov=document.createElement('div'); ov.className='adm-overlay';
      ov.innerHTML='<div class="adm-modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><div class="adm-modal-h"><span>'+esc(title)+'</span><button class="adm-x" aria-label="إغلاق">✕</button></div>'+
        '<div class="adm-modal-b">'+bodyHtml+'</div>'+
        '<div class="adm-modal-f"><button class="abtn adm-cancel">إلغاء</button><button class="abtn pri adm-save">حفظ</button></div></div>';
      document.body.appendChild(ov);
      // Escape closes; focus goes back to what opened it.
      var opener=document.activeElement;
      function onKey(e){
        if(e.key==='Escape'){ e.preventDefault(); close(); return; }
        if(e.key!=='Tab') return;
        // keep Tab inside the dialog
        var f=Array.prototype.filter.call(ov.querySelectorAll('button,input,select,textarea,[tabindex]:not([tabindex="-1"])'),function(x){ return !x.disabled && x.offsetParent!==null; });
        if(!f.length) return;
        var first=f[0], last=f[f.length-1];
        if(e.shiftKey && document.activeElement===first){ e.preventDefault(); last.focus(); }
        else if(!e.shiftKey && document.activeElement===last){ e.preventDefault(); first.focus(); }
      }
      document.addEventListener('keydown',onKey);
      function close(){
        document.removeEventListener('keydown',onKey);
        if(ov.parentNode) ov.parentNode.removeChild(ov);
        try{ if(opener&&opener.focus) opener.focus(); }catch(_){}
      }
      ov.querySelector('.adm-x').onclick=close; ov.querySelector('.adm-cancel').onclick=close;
      ov.addEventListener('click',function(e){ if(e.target===ov) close(); });
      ov.querySelector('.adm-save').onclick=function(){ onSave(ov, close); };
      var f=ov.querySelector('input,textarea,select'); if(f) setTimeout(function(){ try{f.focus();}catch(_){} },50);
      return ov;
    }

        '<div class="rel-row"><span class="k">الإصدار</span><span class="v">'+esc(apk.version||'—')+'</span></div>'+
        '<div class="rel-row"><span class="k">ملاحظات</span><span class="v">'+esc(apk.notes_ar||apk.notes_en||'—')+'</span></div>'+
        '<div class="rel-row"><span class="k">رابط التحميل</span><span class="v"><a href="'+esc(apk.url||'#')+'" target="_blank" rel="noopener" style="color:var(--accent)">فتح</a></span></div>'+
        '</div>' : '<div class="rel-card"><div class="empty-mini">تعذّر جلب version.json.</div></div>';
      var share='<div class="rel-card"><h4 style="margin:0 0 10px">رابط المشاركة العام</h4><div class="rel-row"><span class="v"><code>https://moathdarweesh.github.io/vault/get/</code></span></div></div>';
      var gen='<div class="rel-card"><h4 style="margin:0 0 12px">مولّد version.json لإصدار جديد</h4>'+
        '<label>رقم البناء (versionCode)</label><input id="g-build" type="number" placeholder="3">'+
        '<label>الإصدار</label><input id="g-ver" type="text" placeholder="1.2">'+
        '<label>معرّف ملف Drive أو رابطه المباشر</label><input id="g-id" type="text" placeholder="Drive file id أو https://…">'+
        '<label>ملاحظات (عربي)</label><input id="g-ar" type="text" placeholder="ماذا الجديد؟">'+
        '<label>ملاحظات (إنجليزي)</label><input id="g-en" type="text" placeholder="What\'s new?">'+
        '<button class="btn" id="g-go" style="margin-top:4px">توليد</button>'+
        '<div class="empty-mini" style="margin-top:8px">هذا هو <b>الملف الكامل</b> — انسخه كما هو ليحلّ محلّ version.json بالكامل. مفتاح <code>web</code> محفوظ تلقائياً؛ حذفه يوقف تحديثات الويب لكل الأجهزة.</div>'+
        '<textarea class="gen" id="g-out" readonly placeholder="سيظهر هنا ملف version.json الكامل" style="margin-top:12px"></textarea></div>';
      box.innerHTML=cur+share+gen;
      $('#g-go').addEventListener('click',function(){
        var id=($('#g-id').value||'').trim();
        var url=id.indexOf('http')===0?id:('https://drive.usercontent.google.com/download?id='+id+'&export=download&confirm=t');
        // MERGE into the live manifest. Emitting only {apk:{…}} (as this used to)
        // and pasting it over version.json DELETES the `web` key — which is what
        // js/update.js compares to decide whether to reload devices onto a new web
        // build. Losing it silently disables fleet-wide web updates.
        var out = Object.assign({}, manifest || {});

      });
    }

    /* ---------------- per-user drilldown ----------------------------------- */
    async function openUser(uid){
      var u=DATA.usersById[uid]||{id:uid,username:null,unit:'kg',role:'user',status:'active'};
      var box=$('#detail'), inner=$('#detail-inner');
      inner.innerHTML='<div class="center">جارٍ تحميل بيانات المستخدم…</div>';
      box.classList.add('show'); window.scrollTo(0,0);
      try{
        // ONE read: the user's vault_data blob (admin-read policy, migration 18).
        // This replaced six mirror-table queries plus a chunked sets fetch — and
        // it is COMPLETE, which the mirror never was: its projection resolved
        // seed exercises by name against the global catalog and silently dropped
        // every session it could not match, so the old drill-down showed 0
        // sessions for a user whose blob held 152.
        var r=await sb.from('vault_data').select('data').eq('user_id',uid).maybeSingle();
        if(r.error) throw new Error(r.error.message);
        var b=(r.data&&r.data.data)||{};
        var arr=function(x){return Array.isArray(x)?x:[];};
        // Names resolve from the user's OWN exercise list — blob ids are local
        // and (for seed exercises) never matched the global catalog's ids.
        arr(b.exercises).forEach(function(e){ if(e&&e.id&&!exMap[e.id]) exMap[e.id]={name:e.name,category:e.category||'Other'}; });
        var sessions=[], sets=[];
        arr(b.sessions).forEach(function(sx){
          if(!sx||!sx.id) return;
          sessions.push({id:sx.id, exercise_id:sx.exerciseId, performed_on:sx.date});
          arr(sx.sets).forEach(function(x,i){ sets.push({session_id:sx.id, set_index:i, reps:(+x.reps||0), weight:(+x.weight||0)}); });
        });
        // The blob's plan is a ROTATION (ordered cycle slots), not weekday rows;
        // each slot renders as one "day" card in cycle order.
        var plans=[], planEx=[];
        var trainingDays=(b.plan&&Array.isArray(b.plan.trainingDays))?b.plan.trainingDays:[];
        var cyc=(b.plan&&Array.isArray(b.plan.cycle))?b.plan.cycle:[];
        cyc.forEach(function(slot,i){
          plans.push({day_of_week:i, name:(slot&&slot.name)||('Workout '+(i+1))});
          arr(slot&&slot.exerciseIds).forEach(function(exId,pos){ planEx.push({day_of_week:i, exercise_id:exId, position:pos}); });
        });
        var foods=[];
        if(b.foodLogs&&typeof b.foodLogs==='object'&&!Array.isArray(b.foodLogs)){
          Object.keys(b.foodLogs).forEach(function(dt){
            arr(b.foodLogs[dt]).forEach(function(f){
              foods.push({logged_on:dt, name:(f&&f.name)||'—', calories:(+((f&&f.calories)||0))*(+((f&&f.servings)||1))});
            });
          });
        }
        var sleeps=arr(b.sleep).map(function(sl){
          return {slept_on:sl.date, sleep_time:sl.sleepTime||null, wake_time:sl.wakeTime||null,
                  duration_min:(+sl.durationMinutes||0)};
        });
        var customs=arr(b.exercises).filter(function(e){return e&&e.isCustom;})
          .map(function(e){return {id:e.id, name:e.name, category:e.category||'Other'};});
        renderDetail(u, {sessions:sessions,sets:sets,plans:plans,planEx:planEx,foods:foods,sleeps:sleeps,customs:customs,trainingDays:trainingDays});
      }catch(e){ inner.innerHTML='<div class="d-top"><button class="d-back" id="dback">‹ رجوع</button></div><div class="center">تعذّر التحميل: '+esc(e.message||e)+'</div>'; wireBack(); }
    }

    var DOW_AR=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
    function planVsDone(u, d){
      // trainingDays holds weekday numbers (0=Sun). The blob's own convention.
      var td = d.trainingDays || [];
      var isTraining = {}; td.forEach(function(n){ isTraining[n]=true; });
      // Distinct dates trained, so a 5-exercise workout counts as ONE day —
      // the same trap migration 19 documents on the SQL side.
      var done = {};
      (d.sessions||[]).forEach(function(s){ if(s.performed_on) done[s.performed_on]=true; });

      var start = new Date(); start.setHours(0,0,0,0);
      start.setDate(start.getDate() - ((start.getDay()+1)%7));   // back to Saturday
      var rows='';
      for (var i=0;i<7;i++){
        var day = new Date(start); day.setDate(start.getDate()+i);
        var iso = day.getFullYear()+'-'+('0'+(day.getMonth()+1)).slice(-2)+'-'+('0'+day.getDate()).slice(-2);
        var dow = day.getDay();
        var planned = isTraining[dow] ? 1 : 0;
        var did = done[iso] ? 1 : 0;
        var future = day.getTime() > Date.now();
        var label = planned ? (did+' / '+planned) : 'راحة';
        var cls = !planned ? 'rest' : (did>=planned ? 'met' : (future ? 'ahead' : 'short'));
        rows += '<div class="pvd"><span class="pvd-day">'+DOW_AR[dow]+'</span>'+
          '<span class="pvd-track">'+
            (planned?'<span class="pvd-plan"></span>':'')+
            (did?'<span class="pvd-done"></span>':'')+
          '</span>'+
          '<span class="pvd-label num '+cls+'" dir="ltr">'+label+'</span></div>';
      }
      return rows;
    }

    function renderDetail(u, d){
      var setsBy={}; d.sets.forEach(function(s){(setsBy[s.session_id]=setsBy[s.session_id]||[]).push(s);});
      var byDate={}; d.sessions.forEach(function(s){(byDate[s.performed_on]=byDate[s.performed_on]||[]).push(s);});
      var dates=Object.keys(byDate).sort().reverse();
      var logHtml=dates.length? dates.map(function(dt){
        var exs=byDate[dt].map(function(s){
          var st=(setsBy[s.id]||[]).sort(function(a,b){return a.set_index-b.set_index;});
          var setsH=st.length? st.map(function(x){return '<span class="set"><b>'+x.reps+'</b>×'+(+x.weight)+'</span>';}).join('') : '<span class="muted" style="font-size:12px">—</span>';
          return '<div class="ex"><span class="ex-name"><span class="tag" style="background:'+catColor(exCat(s.exercise_id))+'"></span>'+esc(exName(s.exercise_id))+'</span><span class="sets">'+setsH+'</span></div>';
        }).join('');
        return '<div class="daygrp"><div class="daygrp-h"><span class="daygrp-date">'+esc(dt)+'</span><span class="daygrp-meta">'+byDate[dt].length+' تمرين</span></div>'+exs+'</div>';
      }).join('') : '<div class="empty-mini">لا جلسات مسجّلة.</div>';
      var DOW=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
      var exByDay={}; d.planEx.forEach(function(p){(exByDay[p.day_of_week]=exByDay[p.day_of_week]||[]).push(p);});
      var planHtml=d.plans.length? d.plans.sort(function(a,b){return a.day_of_week-b.day_of_week;}).map(function(pd){
        var exs=(exByDay[pd.day_of_week]||[]).sort(function(a,b){return a.position-b.position;});
        var li=exs.length? exs.map(function(pe){return '<li><span class="dot" style="background:'+catColor(exCat(pe.exercise_id))+'"></span>'+esc(exName(pe.exercise_id))+'</li>';}).join('') : '<li class="muted">—</li>';
        return '<div class="day"><div class="day-name">'+esc(pd.name||DOW[pd.day_of_week]||('#'+(pd.day_of_week+1)))+'</div><ul>'+li+'</ul></div>';
      }).join('') : '<div class="empty-mini">لا خطة أسبوعية.</div>';
      var custHtml=d.customs.length? '<div class="chips">'+d.customs.map(function(e){return '<span class="chip"><span class="tag" style="background:'+catColor(e.category)+'"></span>'+esc(e.name)+'</span>';}).join('')+'</div>' : '<div class="empty-mini">لا تمارين خاصة.</div>';
      var foodHtml=d.foods.length? '<div class="rows2">'+d.foods.slice().sort(function(a,b){return (b.logged_on||'').localeCompare(a.logged_on||'');}).map(function(f){
        return '<div class="row2"><span class="r-name">'+esc(f.name)+'</span><span class="r-val num">'+Math.round(+f.calories)+' سعرة</span><span class="r-meta num">'+esc(f.logged_on)+'</span></div>';
      }).join('')+'</div>' : '<div class="empty-mini">لا وجبات مسجّلة.</div>';
      var sleepHtml=d.sleeps.length? '<div class="rows2">'+d.sleeps.slice().sort(function(a,b){return (b.slept_on||'').localeCompare(a.slept_on||'');}).map(function(s){
        var h=Math.floor((s.duration_min||0)/60), m=(s.duration_min||0)%60;
        return '<div class="row2"><span class="r-name num" style="direction:ltr">'+esc(s.sleep_time||'—')+' → '+esc(s.wake_time||'—')+'</span><span class="r-val num">'+h+'س '+m+'د</span><span class="r-meta num">'+esc(s.slept_on)+'</span></div>';
      }).join('')+'</div>' : '<div class="empty-mini">لا نوم مسجّل.</div>';
      var totSets=d.sets.length, totVol=Math.round(d.sets.reduce(function(a,x){return a+(x.reps*(+x.weight||0));},0));
      // The design's "الخطة مقابل التنفيذ" + "الأرقام" pair, above the existing
      // sections. Adherence is read from the SAME RPC the users table uses, so
      // the profile and the list can never quote different percentages.
      var pct = (u.pct===null||u.pct===undefined) ? null : u.pct;
      var statRows=[
        ['الالتزام هذا الأسبوع', pct===null?'—':pct+'%', pct===null?'var(--mute)':(pct<50?'var(--warn)':'var(--dim)')],
        ['أيام الخطة أسبوعياً', u.trainingDays?fmt(u.trainingDays):'—','var(--text)'],
        ['إجمالي الجلسات', fmt(d.sessions.length),'var(--text)'],
        ['تمارين خاصة', fmt(d.customs.length),'var(--text)']
      ].map(function(r){
        return '<div class="snap"><span class="slab">'+r[0]+'</span>'+
          '<span class="sval num" dir="ltr" style="color:'+r[2]+'">'+r[1]+'</span></div>';
      }).join('');

      var profile =
        '<div class="ogrid" style="margin-bottom:18px">'+
          '<div class="panel2"><div class="p2head">'+
            '<span class="p2title">الخطة مقابل التنفيذ</span>'+
            '<span class="pvd-legend"><span><i class="k-plan"></i>مخطّط</span><span><i class="k-done"></i>منفّذ</span></span>'+
          '</div>'+planVsDone(u,d)+
          '<div class="p2foot">الأسبوع من السبت — نفس الأسبوع الذي تحسبه الأرقام أعلاه.</div></div>'+
          '<div class="panel2 accent"><div class="p2head2"><span class="p2title">الأرقام</span>'+
            '<span class="p2week num" dir="ltr">'+esc(weekLabel())+'</span></div>'+
            '<div class="snaps">'+statRows+'</div></div>'+
        '</div>';

      $('#detail-inner').innerHTML=
        '<div class="d-top"><button class="d-back" id="dback">‹ رجوع للقائمة</button><span class="d-id">'+esc(u.id)+'</span></div>'+
        '<div class="d-title"><span class="av">'+esc(initial(u))+'</span><span class="name">'+nameHtml(u)+'</span></div>'+
        '<div class="stats">'+tile(d.sessions.length,'جلسة','alt')+tile(totSets,'مجموعة','')+tile(totVol.toLocaleString('en-US'),'حِمل ('+(u.unit==='lb'?'LB':'KG')+')','')+tile(d.customs.length,'تمرين خاص','')+'</div>'+
        mgmtHtml(u)+
        profile+
        sec('دورة التمارين','<div class="plan">'+planHtml+'</div>')+
        sec('سجلّ التمارين','<div class="log">'+logHtml+'</div>')+
        sec('التمارين الخاصة',custHtml)+
        sec('التغذية',foodHtml)+
        sec('النوم',sleepHtml);
      wireBack();
      var rs=$('#mg-role'); if(rs)rs.addEventListener('change',function(){ changeRole(u.id, rs.value, function(){ var uu=DATA.usersById[u.id]; if(uu)openUser(u.id); }); });
      Array.prototype.forEach.call(document.querySelectorAll('#detail [data-st]'),function(b){ b.addEventListener('click',function(){ changeStatus(u.id, b.getAttribute('data-st')); }); });
    }

    /* ---------------- export ----------------------------------------------- */
    function exportAll(){
      var payload={ exported:'VAULT admin export', totals:DATA.totals, analytics:DATA.analytics,
        users:DATA.usersList, feedback:DATA.feedback };
      var blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
      var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='vault-export.json'; a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);},1000); toast('تم تصدير البيانات');
    }

    // COMPLETE backup: every admin-readable table, all rows (paginated), as one
    // timestamped JSON. Free, no credentials. Run before any risky DB operation.
    // Migration 18 dropped the 13 mirror tables; vault_data (now admin-readable,
    // ALL users' rows) carries everything they used to hold — so this backup got
    // MORE complete, not less: it now includes every user's actual blob.
    var BACKUP_TABLES=['profiles','exercises','cardio_types','user_flags','feedback',
      'audit_log','admins','food_catalog','preset_plans','app_config','vault_data'];
    async function exportBackup(){
      toast('جارٍ إنشاء النسخة الاحتياطية…');
      var out={ backup:'VAULT full backup', schema:'v4', exported_at:new Date().toISOString(),
        note:'يشمل كل الجداول الباقية بعد حذف المرآة (migration 18). vault_data يحتوي مدوّنات كل المستخدمين (سياسة قراءة أدمِن) — فهذه النسخة الآن أكمل من أي نسخة سابقة. السكيما في backend/*.sql بالمستودع.',
        counts:{}, tables:{} }, errs=[];
      for(var i=0;i<BACKUP_TABLES.length;i++){
        var t=BACKUP_TABLES[i];
        var r=await fetchAll((function(tbl){return function(a,b){return sb.from(tbl).select('*').range(a,b);};})(t));
        if(r.error){ errs.push(t+': '+r.error.message); out.tables[t]=[]; out.counts[t]='error'; }
        else { out.tables[t]=r.data||[]; out.counts[t]=(r.data||[]).length; }
      }
      if(errs.length) out.errors=errs;
      var total=Object.keys(out.counts).reduce(function(s,k){return s+(typeof out.counts[k]==='number'?out.counts[k]:0);},0);
      var name='vault-backup-'+new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')+'.json';
      var blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
      var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
      setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
      toast('تمّت النسخة الاحتياطية · '+total+' صف'+(errs.length?(' ('+errs.length+' تعذّر)'):''));
    }

    /* ---------------- boot -------------------------------------------------- */
    (async function(){
      if(location.hash.indexOf('type=recovery')!==-1){ showLogin(); showPanel('panel-newpw'); return; }
      var s=await sb.auth.getSession();
      if(s&&s.data&&s.data.session) checkAdminAndLoad(); else showLogin();
    })();
  })();
  </script>
</body>
</html>
