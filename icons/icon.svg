<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>THE VAULT</title>
  <!--
    THE VAULT app icon, exactly as specified in the Claude Design brand kit
    ("Vault Brand Kit", section 01 APP ICON): a solid V letterform on a tile,
    over the five-bar field rendered as a pinstripe texture.

    Two variants in one file, following the system appearance:
      dark  = black tile, orange letter
      light = orange tile, black letter
    The swap is a prefers-color-scheme media query inside the SVG, which a
    browser honours when this is loaded as an image. Anything that ignores it
    keeps the dark variant, which is the primary.

    NOTE the V is NOT the five bars. The bars are the IN-APP mark (ICONS.vault)
    and the status-bar icon (ic_stat_vault.xml); here they survive only as the
    texture behind the letter. The brand kit is explicit about this split, and
    an earlier pass got it wrong by putting the bars on the tile.

    Geometry is the kit's, not re-derived: the tile radius is 22.5% of its side
    (38/170 in the kit), and the 24-unit glyph box is scaled to 61% of the tile
    and centred, giving scale 13.05 at 512.
  -->
  <style>
    .tile { fill: #000000; }
    .mark { fill: #ff6a00; }
    .grain { fill: #ffffff; fill-opacity: .035; }
    @media (prefers-color-scheme: light) {
      .tile { fill: #ff6a00; }
      .mark { fill: #000000; }
      .grain { fill: #000000; fill-opacity: .06; }
    }
  </style>
  <defs>
    <!-- The five-bar field as a repeating texture: the kit uses a 2px bar on an
         11px pitch at 170px, which is 6 on 33 at this scale. -->
    <pattern id="bars" width="33" height="512" patternUnits="userSpaceOnUse">
      <rect class="grain" width="6" height="512"/>
    </pattern>
    <clipPath id="tileClip">
      <rect width="512" height="512" rx="115"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tileClip)">
    <rect class="tile" width="512" height="512"/>
    <rect width="512" height="512" fill="url(#bars)"/>
  </g>
  <g transform="translate(99.5 99.5) scale(13.05)">
    <path class="mark" d="M4.4 4.5h3.4l4.2 11.4L16.2 4.5h3.4L13.7 20.4h-3.4Z"/>
  </g>
</svg>
