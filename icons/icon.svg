<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>THE VAULT</title>
  <!--
    THE VAULT app icon. The identity is THE BARBELL (v403, owner decision): the
    five rectangles of ICONS.dumbbell in js/catalog.js, the same glyph the
    splash draws and the launcher, themed and status-bar icons redraw. Contract
    72 holds all of them to that glyph, so edit the glyph, not a copy.

    This file used to carry THE CUT: a V letterform with a slot and an accent
    hairline through it, on a pinstripe of the old five bars. All of that is
    gone. Do not bring the V back.

    Geometry: the 24-unit glyph at scale 15, inset 76, so its centre (12,12)
    lands on the tile's and the ink spans 315 of 512 px, 61.5%. The farthest
    ink, an outer plate's corner, sits 181px from the centre: inside the
    maskable safe circle (the inner 80%, radius 204.8px), which matters because
    manifest.json declares this icon maskable.

    Fills, "the embers" (the owner's choice): outer plates ember #b84a00, inner
    plates the accent #ff6a00, the shaft bone. One variant per system
    appearance, through a prefers-color-scheme query that a browser honours
    when this is loaded as an image; anything that ignores it keeps the dark
    variant, which is the primary.
      dark  = black tile, inner plates #ff6a00, shaft #fdfaf7
      light = bone tile #faf5f0, inner plates #e05c00, shaft #1a1512
    On the bone tile the inner plates step down to the accent's second step
    (#e05c00, 3.40:1), because the raw accent is 2.65:1 there, the same move
    the macro bars make on light. Every plate holds 3:1 on its tile and the
    shaft 4.5:1; scripts/test-brand-icon.js renders both and checks.

    No double hyphen may appear in this comment: it makes the whole file fail
    to parse as an image, and only a render catches that.
  -->
  <style>
    .tile { fill: #000000; }
    .outer { fill: #b84a00; }
    .inner { fill: #ff6a00; }
    .shaft { fill: #fdfaf7; }
    @media (prefers-color-scheme: light) {
      .tile { fill: #faf5f0; }
      .inner { fill: #e05c00; }
      .shaft { fill: #1a1512; }
    }
  </style>
  <defs>
    <clipPath id="tileClip">
      <rect width="512" height="512" rx="115"/>
    </clipPath>
  </defs>
  <g clip-path="url(#tileClip)">
    <rect class="tile" width="512" height="512"/>
    <g transform="translate(76 76) scale(15)">
      <rect class="outer" x="1.5" y="9" width="3" height="6" rx="1.2"/>
      <rect class="inner" x="5.5" y="6" width="4" height="12" rx="1.6"/>
      <rect class="inner" x="14.5" y="6" width="4" height="12" rx="1.6"/>
      <rect class="outer" x="19.5" y="9" width="3" height="6" rx="1.2"/>
      <rect class="shaft" x="9.5" y="10.4" width="5" height="3.2"/>
    </g>
  </g>
</svg>
