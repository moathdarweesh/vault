<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE VAULT — Knowledge Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b16; --surface-1:#10101d; --surface-2:#181828; --surface-3:#222236;
  --border:rgba(220,224,255,.10); --border-hi:rgba(220,224,255,.19);
  --text:#f2f3fa; --text-mute:#a4a7bd; --text-dim:#8b8ea6;
  --accent:#ff6a00; --accent-soft:rgba(255,106,0,.16);
  --pad:14px; --r:12px;
  --ui:'IBM Plex Sans Arabic',system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
#app{display:grid;grid-template-columns:290px 1fr;height:100%}

/* ---------- left rail ---------- */
#rail{background:var(--surface-1);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.brand{padding:16px var(--pad) 12px;border-bottom:1px solid var(--border)}
.brand h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.brand h1 b{color:var(--accent);font-weight:700}
.brand .sub{margin-top:5px;font-size:11px;color:var(--text-dim);font-family:var(--mono)}
.search{padding:12px var(--pad);border-bottom:1px solid var(--border)}
.search input{width:100%;height:38px;padding:0 11px;border-radius:10px;border:1px solid var(--border-hi);
  background:var(--surface-2);color:var(--text);font-family:inherit;font-size:13px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.sec{padding:12px var(--pad) 6px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-dim);font-weight:700}
#types{display:flex;flex-wrap:wrap;gap:5px;padding:0 var(--pad) 10px}
.chip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:999px;
  border:1px solid var(--border);background:transparent;color:var(--text-mute);font-size:11px;font-weight:600;
  transition:background .12s,border-color .12s,color .12s}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:none}
.chip.on{background:var(--surface-3);border-color:var(--border-hi);color:var(--text)}
.chip .n{font-family:var(--mono);font-size:10px;color:var(--text-dim)}
#comms{flex:1;overflow-y:auto;padding:0 8px 14px;scrollbar-width:thin;scrollbar-color:var(--border-hi) transparent}
.crow{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border:0;border-radius:8px;
  background:transparent;text-align:left;font-size:12px;line-height:1.3;transition:background .12s}
.crow:hover{background:var(--surface-2)}
.crow.on{background:var(--accent-soft)}
.crow .sw{width:9px;height:9px;border-radius:50%;flex:none}
.crow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .n{font-family:var(--mono);font-size:10px;color:var(--text-dim)}
.foot{padding:9px var(--pad);border-top:1px solid var(--border);font-size:10px;color:var(--text-dim);
  font-family:var(--mono);display:flex;justify-content:space-between;gap:8px}

/* ---------- stage ---------- */
#stage{position:relative;min-width:0;background:
  radial-gradient(ellipse 92% 74% at 50% 46%, #14142a 0%, #0b0b16 68%)}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;top:12px;left:12px;display:flex;gap:6px}
.hbtn{height:32px;padding:0 12px;border-radius:9px;border:1px solid var(--border-hi);
  background:rgba(16,16,29,.86);backdrop-filter:blur(8px);font-size:12px;font-weight:600;color:var(--text-mute)}
.hbtn:hover{color:var(--text);border-color:var(--accent)}
#tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .1s;z-index:5;
  background:rgba(24,24,40,.97);border:1px solid var(--border-hi);border-radius:9px;padding:7px 10px;
  font-size:12px;max-width:300px;box-shadow:0 8px 26px rgba(0,0,0,.6)}
#tip .t{font-weight:700;margin-bottom:2px;word-break:break-word}
#tip .m{font-size:10px;color:var(--text-dim);font-family:var(--mono)}

/* ---------- detail panel ---------- */
#panel{position:absolute;top:0;right:0;bottom:0;width:330px;background:rgba(16,16,29,.97);
  backdrop-filter:blur(12px);border-left:1px solid var(--border);transform:translateX(100%);
  transition:transform .22s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;z-index:6}
#panel.open{transform:none}
.ph{padding:16px var(--pad) 12px;border-bottom:1px solid var(--border);display:flex;gap:10px;align-items:flex-start}
.ph .who{flex:1;min-width:0}
.ph h2{margin:0;font-size:15px;font-weight:700;word-break:break-word;line-height:1.32}
.ph .k{margin-top:5px;font-size:10px;font-family:var(--mono);color:var(--accent);
  text-transform:uppercase;letter-spacing:.09em}
.x{width:28px;height:28px;flex:none;border-radius:8px;border:1px solid var(--border);
  background:transparent;color:var(--text-mute);font-size:15px;line-height:1}
.x:hover{border-color:var(--accent);color:var(--text)}
.pb{flex:1;overflow-y:auto;padding:12px var(--pad) 20px;scrollbar-width:thin;scrollbar-color:var(--border-hi) transparent}
.meta{font-size:11px;color:var(--text-mute);font-family:var(--mono);word-break:break-all;line-height:1.65;margin-bottom:14px}
.meta b{color:var(--text-dim);font-weight:400}
.pb h3{margin:14px 0 7px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-dim)}
.nb{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border:0;border-radius:7px;
  background:transparent;text-align:left;font-size:12px}
.nb:hover{background:var(--surface-2)}
.nb .sw{width:7px;height:7px;border-radius:50%;flex:none}
.nb .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nb .rel{font-size:9px;color:var(--text-dim);font-family:var(--mono)}
.empty{color:var(--text-dim);font-size:12px;padding:6px 0}
@media (max-width:860px){#app{grid-template-columns:1fr}#rail{display:none}#panel{width:100%}}
</style>
</head>
<body>
<div id="app">
  <aside id="rail">
    <div class="brand">
      <h1>THE <b>VAULT</b></h1>
      <div class="sub" id="brandsub">—</div>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Search nodes…" autocomplete="off" spellcheck="false"></div>
    <div class="sec">Kinds</div>
    <div id="types"></div>
    <div class="sec">Clusters <span id="ccount" style="color:var(--text-dim)"></span></div>
    <div id="comms"></div>
    <div class="foot"><span id="shown">—</span><span id="fps">—</span></div>
  </aside>
  <main id="stage">
    <canvas id="cv"></canvas>
    <div id="hud">
      <button class="hbtn" id="reset">Fit</button>
      <button class="hbtn" id="lbl">Labels: off</button>
      <button class="hbtn" id="clear">Clear filters</button>
    </div>
    <div id="tip"></div>
    <aside id="panel">
      <div class="ph">
        <div class="who"><h2 id="pt">—</h2><div class="k" id="pk">—</div></div>
        <button class="x" id="px" aria-label="Close">✕</button>
      </div>
      <div class="pb">
        <div class="meta" id="pm"></div>
        <h3>Connections <span id="pn" style="font-family:var(--mono)"></span></h3>
        <div id="pl"></div>
      </div>
    </aside>
  </main>
</div>
<!--GRAPH_DATA-->
<script>
// Canvas cannot resolve var(--ui): a ctx.font string is parsed by the canvas,
// not by CSS. Declared once so the picture and the page never drift apart.
const CANVAS_FONT = "'IBM Plex Sans Arabic', system-ui, sans-serif";
const MONO_FONT = "'JetBrains Mono', ui-monospace, monospace";
// Below this zoom a node is smaller than a few pixels and 1643 of them read as
// noise; the cluster bubbles carry the structure instead.
const MAP_K = 0.30;
let mapEdges = {}, hoverComm = null;
// Soft, evenly-weighted hues. Nothing is pure saturated brand orange: at 1684
// dots one loud hue drags the eye and the rest read as background.
const PALETTE = ['#e8646e','#6b9bd2','#8cc152','#e6c34a','#e8913c','#e88fb0',
                 '#4db6ac','#a1887f','#d6d2ce','#a58fc4','#ef8a72','#9ccc65',
                 '#5c9ead','#d98cb3','#c2a84a','#7e9fd4','#b0d06a','#e0a3a0'];
// Kept only for the Kinds chips' dots, so a filter still reads as itself.
const TYPE_COLOR = {
  'function':'#ff8a3c','api-method':'#ffa96b','api':'#ffc98a','method':'#e8873a',
  'doc':'#6b9bd2','file':'#d6d2ce','ui':'#a58fc4','config':'#8a8f98',
  'sql-table':'#4db6ac','sql-function':'#64e3c0','sql-trigger':'#9ef0da','sql-object':'#4db6ac',
  'class':'#e6c34a','constant':'#7a7f88','script':'#5c9ead','symbol':'#6b7079'
};
const $ = (s) => document.querySelector(s);
let G, nodes, links, byId, comms, adj = new Map();
let view = {x:0, y:0, k:1}, hover = null, selected = null;
let typeOff = new Set(), commFilter = null, query = '', labelMode = 'off';
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const r = cv.parentElement.getBoundingClientRect();
  const oldW = W, oldH = H;
  W = r.width; H = r.height;
  cv.width = Math.round(W*DPR); cv.height = Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // Keep the same world area visible. Without this the scale stays pinned to
  // whatever the canvas measured when fit() last ran — and on a cold open that
  // is a canvas that has not finished laying out.
  if (oldW > 0 && oldH > 0 && W > 0 && H > 0){
    const s = Math.min(W/oldW, H/oldH);
    if (s > 0 && isFinite(s)) view.k *= s;
  }
  draw();
}
// Stable: the same cluster keeps its colour across rebuilds as long as its id
// does, and adjacent ids do not land on adjacent hues.
const commColor = (cid) => {
  let x = 0; const s = String(cid);
  for (let i=0;i<s.length;i++) x = (x*131 + s.charCodeAt(i)) >>> 0;
  return PALETTE[x % PALETTE.length];
};
const nodeColor = (n) => commColor(n.community);
const norm = (s) => String(s||'').toLowerCase();

function visible(n){
  if (typeOff.has(n.type)) return false;
  if (commFilter !== null && String(n.community) !== commFilter) return false;
  if (query && !norm(n.label).includes(query) && !norm(n.source_file).includes(query)) return false;
  return true;
}
const toScreen = (x,y) => [ (x - view.x)*view.k + W/2, (y - view.y)*view.k + H/2 ];
const toWorld  = (sx,sy) => [ (sx - W/2)/view.k + view.x, (sy - H/2)/view.k + view.y ];
// Small and close to uniform, with real hubs allowed to grow. Big dots at this
// count turn every cluster into a blob.
const radius = (n) => Math.max(1.7, Math.min(9, 1.7 + Math.sqrt(n.deg||0)*1.05));
// hex + alpha, for edges that carry their cluster's colour
const withAlpha = (hex, a) => {
  const v = parseInt(hex.slice(1), 16);
  return `rgba(${(v>>16)&255},${(v>>8)&255},${v&255},${a})`;
};

let lastT = performance.now(), frames = 0;
function draw(){
  ctx.clearRect(0,0,W,H);
  const vis = new Set();
  for (const n of nodes) if (visible(n)) vis.add(n.id);
  const focus = selected ? (adj.get(selected.id) || new Set()) : null;

  // edges
  ctx.lineWidth = Math.max(.45, .9*view.k);
  for (const e of links){
    if (!vis.has(e.source) || !vis.has(e.target)) continue;
    const a = byId.get(e.source), b = byId.get(e.target);
    const lit = focus && (focus.has(a.id) && focus.has(b.id)) &&
                (a.id === selected.id || b.id === selected.id);
    if (focus && !lit) { if (view.k < .8) continue; ctx.strokeStyle = 'rgba(255,232,212,.045)'; }
    else if (lit) ctx.strokeStyle = '#ffffff';
    // An edge belongs to the cluster it leaves. Inside a cluster that paints the
    // star's own spokes in its colour; between clusters it shows which one
    // reached out, which grey edges cannot say.
    else ctx.strokeStyle = withAlpha(commColor(a.community), a.community === b.community ? .34 : .17);
    const [x1,y1] = toScreen(a.x,a.y), [x2,y2] = toScreen(b.x,b.y);
    if ((x1<0&&x2<0)||(x1>W&&x2>W)||(y1<0&&y2<0)||(y1>H&&y2>H)) continue;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }

  // nodes
  const labelled = [];
  for (const n of nodes){
    if (!vis.has(n.id)) continue;
    const [sx,sy] = toScreen(n.x,n.y);
    const r = radius(n)*Math.max(.55, Math.min(1.9, view.k));
    if (sx<-r-2||sx>W+r+2||sy<-r-2||sy>H+r+2) continue;
    const dim = focus && !focus.has(n.id) && n.id !== selected.id;
    ctx.globalAlpha = dim ? .17 : 1;
    ctx.fillStyle = nodeColor(n);
    ctx.beginPath(); ctx.arc(sx,sy,r,0,6.283); ctx.fill();
    if (n === selected || n === hover){
      ctx.globalAlpha = 1; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(sx,sy,r+3.2,0,6.283); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    const want = labelMode==='all' || (labelMode==='auto' && (view.k>1.25 || n.deg>=14 || n===selected || (focus&&focus.has(n.id))));
    if (want && !dim) labelled.push([n,sx,sy,r]);
  }
  ctx.textAlign='left'; ctx.textBaseline='middle';
  ctx.font = '600 11.5px ' + CANVAS_FONT;
  for (const [n,sx,sy,r] of labelled.slice(0,420)){
    const t = n.label.length>34 ? n.label.slice(0,33)+'…' : n.label;
    const w = ctx.measureText(t).width;
    ctx.fillStyle='rgba(11,11,22,.72)';
    ctx.fillRect(sx+r+4, sy-8, w+7, 16);
    ctx.fillStyle = n===selected ? '#ffffff' : 'rgba(242,243,250,.92)';
    ctx.fillText(t, sx+r+7.5, sy+.5);
  }
  $('#shown').textContent = vis.size + ' / ' + nodes.length + ' nodes';
  frames++;
  const now = performance.now();
  if (now-lastT > 900){ $('#fps').textContent = Math.round(frames*1000/(now-lastT)) + ' fps'; frames=0; lastT=now; }
}

function pickComm(sx,sy){
  let best=null, bd=Infinity;
  for (const [cid,c] of Object.entries(comms)){
    const [x,y] = toScreen(c.x,c.y);
    const r = Math.max(7, Math.min(64, 5.5*Math.sqrt(c.n)) * Math.max(.75, view.k*4.2));
    const d = (x-sx)**2 + (y-sy)**2;
    if (d < r*r && d < bd){ bd=d; best=cid; }
  }
  return best;
}
function pick(sx,sy){
  const [wx,wy] = toWorld(sx,sy);
  let best=null, bd=Infinity;
  for (const n of nodes){
    if (!visible(n)) continue;
    const d = (n.x-wx)**2 + (n.y-wy)**2;
    const rr = ((radius(n)+7)/view.k)**2;
    if (d<rr && d<bd){ bd=d; best=n; }
  }
  return best;
}
function fit(list){
  const arr = (list && list.length) ? list : nodes.filter(visible);
  if (!arr.length) return;
  const xs=arr.map(n=>n.x), ys=arr.map(n=>n.y);
  const minX=Math.min(...xs),maxX=Math.max(...xs),minY=Math.min(...ys),maxY=Math.max(...ys);
  view.x=(minX+maxX)/2; view.y=(minY+maxY)/2;
  view.k=Math.min(W/(maxX-minX+260), H/(maxY-minY+260), 3.4) || 1;
  draw();
}

// ---------- panel ----------
function show(n){
  selected = n;
  if (!n){ $('#panel').classList.remove('open'); draw(); return; }
  $('#pt').textContent = n.label;
  $('#pk').textContent = n.type;
  $('#pm').innerHTML =
    `<b>cluster</b> ${esc(comms[String(n.community)]?.name||'—')}<br>` +
    `<b>file</b> ${esc((n.source_file||'—').replace(/\\/g,'/'))}` +
    (n.source_location?`<br><b>at</b> ${esc(String(n.source_location))}`:'') +
    `<br><b>degree</b> ${n.deg}`;
  const nb = [];
  for (const e of links){
    if (e.source===n.id) nb.push([byId.get(e.target), e.relation, '→']);
    else if (e.target===n.id) nb.push([byId.get(e.source), e.relation, '←']);
  }
  $('#pn').textContent = '(' + nb.length + ')';
  $('#pl').innerHTML = nb.length ? '' : '<div class="empty">No connections — this node is isolated.</div>';
  nb.sort((a,b)=>(b[0]?.deg||0)-(a[0]?.deg||0)).slice(0,60).forEach(([t,rel,dir])=>{
    if (!t) return;
    const b = document.createElement('button');
    b.className='nb';
    b.innerHTML = `<span class="sw" style="background:${TYPE_COLOR[t.type]||'#6b7079'}"></span>`+
                  `<span class="nm">${esc(t.label)}</span><span class="rel">${dir} ${esc(rel||'')}</span>`;
    b.onclick = () => { show(t); view.x=t.x; view.y=t.y; view.k=Math.max(view.k,1.5); draw(); };
    $('#pl').appendChild(b);
  });
  $('#panel').classList.add('open');
  draw();
}
const esc = (s) => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---------- build the rail ----------
function buildRail(){
  const tc = {};
  for (const n of nodes) tc[n.type] = (tc[n.type]||0)+1;
  $('#types').innerHTML='';
  Object.entries(tc).sort((a,b)=>b[1]-a[1]).forEach(([t,c])=>{
    const b=document.createElement('button');
    b.className='chip on';
    b.innerHTML=`<span class="dot" style="background:${TYPE_COLOR[t]||'#6b7079'}"></span>${esc(t)}<span class="n">${c}</span>`;
    b.onclick=()=>{ typeOff.has(t)?typeOff.delete(t):typeOff.add(t); b.classList.toggle('on',!typeOff.has(t)); draw(); };
    $('#types').appendChild(b);
  });
  const list = Object.entries(comms).sort((a,b)=>b[1].n-a[1].n);
  $('#ccount').textContent = '(' + list.length + ')';
  $('#comms').innerHTML='';
  for (const [cid,c] of list){
    const b=document.createElement('button');
    b.className='crow';
    b.dataset.cid = cid;
    b.innerHTML=`<span class="sw" style="background:${commColor(cid)}"></span>`+
                `<span class="nm">${esc(c.name)}</span><span class="n">${c.n}</span>`;
    b.onclick=()=>{
      const on = commFilter===cid;
      commFilter = on ? null : cid;
      [...$('#comms').children].forEach(el=>el.classList.remove('on'));
      if (!on){ b.classList.add('on'); fit(nodes.filter(n=>String(n.community)===cid)); }
      else fit();
    };
    $('#comms').appendChild(b);
  }
}

// ---------- interaction ----------
let drag=null;
cv.addEventListener('mousedown', e => { drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y,moved:false}; });
addEventListener('mouseup', e => {
  if (drag && !drag.moved){
    const r=cv.getBoundingClientRect();
    const sx=e.clientX-r.left, sy=e.clientY-r.top;
    show(pick(sx,sy));
  }
  drag=null;
});
cv.addEventListener('mousemove', e => {
  const r=cv.getBoundingClientRect(), sx=e.clientX-r.left, sy=e.clientY-r.top;
  if (drag){
    if (Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>3) drag.moved=true;
    view.x = drag.vx - (e.clientX-drag.x)/view.k;
    view.y = drag.vy - (e.clientY-drag.y)/view.k;
    cv.style.cursor='grabbing'; draw(); return;
  }
  const n = pick(sx,sy);
  cv.style.cursor = n ? 'pointer' : 'grab';
  if (n !== hover){
    hover=n;
    const tip=$('#tip');
    if (n){
      tip.innerHTML=`<div class="t">${esc(n.label)}</div><div class="m">${esc(n.type)} · ${n.deg} links · ${esc(comms[String(n.community)]?.name||'')}</div>`;
      tip.style.opacity='1';
      tip.style.left=Math.min(sx+16, W-310)+'px';
      tip.style.top=Math.max(8, sy-14)+'px';
    } else tip.style.opacity='0';
    draw();
  }
});
cv.addEventListener('wheel', e => {
  e.preventDefault();
  const r=cv.getBoundingClientRect();
  const [wx,wy]=toWorld(e.clientX-r.left, e.clientY-r.top);
  const k=Math.max(.08, Math.min(9, view.k * Math.exp(-e.deltaY*0.0016)));
  view.x = wx - (wx-view.x)*(view.k/k);
  view.y = wy - (wy-view.y)*(view.k/k);
  view.k = k; draw();
}, {passive:false});

$('#q').addEventListener('input', e => {
  query = norm(e.target.value);
  const hits = nodes.filter(visible);
  if (query && hits.length && hits.length < nodes.length) fit(hits); else draw();
});
$('#reset').onclick = () => { commFilter=null; [...$('#comms').children].forEach(el=>el.classList.remove('on')); fit(); };
$('#clear').onclick = () => {
  typeOff.clear(); commFilter=null; query=''; $('#q').value='';
  [...$('#types').children].forEach(el=>el.classList.add('on'));
  [...$('#comms').children].forEach(el=>el.classList.remove('on'));
  show(null); fit();
};
$('#lbl').onclick = () => {
  labelMode = labelMode==='off' ? 'auto' : labelMode==='auto' ? 'all' : 'off';
  $('#lbl').textContent = 'Labels: ' + labelMode; draw();
};
$('#px').onclick = () => show(null);
addEventListener('keydown', e => {
  if (e.key==='Escape'){ show(null); }
  if (e.key==='/' && document.activeElement!==$('#q')){ e.preventDefault(); $('#q').focus(); }
});
// no window 'resize' listener: the ResizeObserver below covers every case that
// changes the canvas box, and both firing would apply the reframe scale twice.

// ---------- boot ----------
const __boot = (d) => {
  G=d; nodes=d.nodes; links=d.links; comms=d.communities||{};
  byId=new Map(nodes.map(n=>[n.id,n]));
  for (const e of links){
    if (!adj.has(e.source)) adj.set(e.source,new Set([e.source]));
    if (!adj.has(e.target)) adj.set(e.target,new Set([e.target]));
    adj.get(e.source).add(e.target); adj.get(e.target).add(e.source);
    // how strongly two clusters are tied — the map level's edges
    const a = byId.get(e.source), b = byId.get(e.target);
    if (a && b && a.community !== b.community){
      const k = [String(a.community), String(b.community)].sort().join('|');
      mapEdges[k] = (mapEdges[k]||0) + 1;
    }
  }
  $('#brandsub').textContent = `${nodes.length} nodes · ${links.length} edges · ${Object.keys(comms).length} clusters`;
  buildRail();
  // The canvas is sized by flex, so its box is not final when this runs.
  // ResizeObserver fires when it genuinely has one — including in a tab that is
  // not painting, which is why this is not two requestAnimationFrames.
  let fitted = false;
  new ResizeObserver(() => {
    resize();
    if (!fitted && W > 40 && H > 40){ fitted = true; fit(); }
  }).observe(cv.parentElement);
  resize();
  if (W > 40 && H > 40){ fitted = true; fit(); }   // already laid out: no wait
};
if (window.__GRAPH__) __boot(window.__GRAPH__);
else fetch('graph.json').then(r=>r.json()).then(__boot).catch(err=>{
  document.body.innerHTML = '<div style="padding:40px;font-family:monospace;color:#ff6a00">' +
    'Could not load the graph. Open the generated vault-graph.html (it has the data inlined).<br><br>' + esc(err.message) + '</div>';
});
</script>
